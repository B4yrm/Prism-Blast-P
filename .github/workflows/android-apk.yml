name: Build Android APK

on:
  push:
    paths: ["idle/**", "fishing/**", "tycoon/index.html", "android/emulator-test.sh", "android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      # Real Android emulator check of the Fishing Tycoon APK (KVM-accelerated).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator test (Fishing Tycoon)
        continue-on-error: true
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash android/emulator-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: game-apks
          path: android/app/build/outputs/apk/*/debug/*.apk
      - name: Commit APK to the branch
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/uni/debug/app-uni-debug.apk apk/UniversitetTycoon.apk
          cp android/app/build/outputs/apk/fish/debug/app-fish-debug.apk apk/BaliqciIdle.apk
          cp android/app/build/outputs/apk/tycoon/debug/app-tycoon-debug.apk apk/FishingTycoon.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/ tycoon/test-results/ || true
          git diff --cached --quiet || git commit -m "Update built APKs [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
