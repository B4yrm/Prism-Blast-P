name: Build Android APK

on:
  push:
    paths: ["idle/**", "android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: universitet-tycoon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Commit APK to the branch
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/UniversitetTycoon.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/UniversitetTycoon.apk
          git diff --cached --quiet || git commit -m "Update built APK [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
