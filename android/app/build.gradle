plugins { id "com.android.application" }

android {
    namespace "az.universitet.tycoon"
    compileSdk 34
    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // One flavor per game; each packs its own page as the only asset.
    flavorDimensions "game"
    productFlavors {
        uni {
            dimension "game"
            applicationId "az.universitet.tycoon"
            resValue "string", "app_name", "Universitet Tycoon"
        }
        fish {
            dimension "game"
            applicationId "az.baliqci.idle"
            resValue "string", "app_name", "Balıqçı Idle"
        }
    }
    sourceSets {
        uni  { assets.srcDirs = ["$buildDir/gameAssets/uni"] }
        fish { assets.srcDirs = ["$buildDir/gameAssets/fish"] }
    }
}

tasks.register("copyUni", Copy) {
    from("$rootDir/../idle/index.html")
    into("$buildDir/gameAssets/uni")
}
tasks.register("copyFish", Copy) {
    from("$rootDir/../fishing/index.html")
    into("$buildDir/gameAssets/fish")
}
preBuild.dependsOn("copyUni", "copyFish")
