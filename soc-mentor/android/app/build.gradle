plugins { id 'com.android.application' }
android {
    namespace 'com.socmentor.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.socmentor.app"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }
    buildTypes {
        release {
            minifyEnabled false
            // İmzalanmamış release; test üçün 'debug' APK istifadə et
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { }
