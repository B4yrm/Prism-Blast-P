<!--DOC-->
<title>Fishing Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/*CSS*/</style>
<!--BODY-->
<div id="game"></div>

<div id="loader">
  <div class="ld-logo"><span>FISHING</span><b>TYCOON</b></div>
  <div class="ld-track"><div id="loadbar"></div></div>
  <p>Ada qurulur…</p>
</div>

<div id="ui">
  <div id="labels"></div>

  <header id="hud">
    <button class="lvl" data-open="map" aria-label="Səviyyə və mərhələlər">
      <span class="ava" data-ic="captain"></span>
      <span class="lvn" id="lvl">1</span>
      <span class="xp"><i id="xpfill"></i></span>
    </button>
    <div class="pill coin"><span class="pi" data-ic="coin"></span><b id="money">0</b><button class="plus" data-open="shop" aria-label="Mağaza">+</button></div>
    <div class="pill gem"><span class="pi" data-ic="gem"></span><b id="gems">0</b><button class="plus" data-open="shop" aria-label="Mağaza">+</button></div>
    <div class="pill fish" title="Anbar və iskələdəki balıq"><span class="pi" data-ic="fish"></span><b id="fishn">0</b></div>
    <div class="pill inc" title="Gəlir / dəqiqə"><span class="pi" data-ic="income"></span><b id="ipm">+0</b><small>/dəq</small></div>
    <button class="ibtn gear" data-open="settings" aria-label="Ayarlar"><span data-ic="gear"></span></button>
  </header>

  <nav id="side" class="closed" aria-label="Menyu">
    <button class="ibtn tog" id="sideTog" aria-expanded="false" aria-label="Menyunu aç"><span data-ic="menu"></span><i class="dot" id="dotSide"></i></button>
    <div class="items">
      <button data-open="missions"><span data-ic="missions"></span><em>Missiyalar</em><i class="dot" id="dotMis"></i></button>
      <button data-open="daily"><span data-ic="daily"></span><em>Gündəlik</em><i class="dot" id="dotDaily"></i></button>
      <button data-open="ach"><span data-ic="trophy"></span><em>Nailiyyət</em><i class="dot" id="dotAch"></i></button>
      <button data-open="log"><span data-ic="bell"></span><em>Bildiriş</em><i class="dot" id="dotLog"></i></button>
      <button data-open="map"><span data-ic="map"></span><em>Xəritə</em></button>
    </div>
  </nav>

  <aside id="mission" class="mini"></aside>

  <nav id="dock" aria-label="Əsas menyu">
    <button data-open="upgrades"><span data-ic="upgrade"></span><em>Təkmilləşdir</em><i class="dot" id="dotUp"></i></button>
    <button data-open="workers"><span data-ic="workers"></span><em>İşçilər</em></button>
    <button data-open="boats"><span data-ic="boats"></span><em>Gəmilər</em></button>
    <button data-open="research"><span data-ic="research"></span><em>Tədqiqat</em><i class="dot" id="dotRes"></i></button>
    <button data-open="shop"><span data-ic="shop"></span><em>Mağaza</em><i class="dot" id="dotShop"></i></button>
  </nav>

  <button id="collect"><span class="ci" data-ic="basket"></span><span class="ct"><b>Topla</b><em id="regamt">$0</em></span></button>

  <div id="toasts" aria-live="polite"></div>

  <div id="scrim" hidden></div>
  <section id="panel" hidden role="dialog" aria-modal="true">
    <header class="ph"><span class="pico" id="pico"></span><div class="ptitle"><h2 id="ptitle"></h2><small id="psub"></small></div><button class="x" id="pclose" aria-label="Bağla"><span data-ic="close"></span></button></header>
    <div class="pbody" id="pbody"></div>
  </section>

  <div id="modal" hidden><div class="mcard" id="mcard"></div></div>
  <div id="flyer"></div>
</div>

<script>/*PHASER*/</script>
<script>/*GAME*/</script>
